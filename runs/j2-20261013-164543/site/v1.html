<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spark 2026</title>
<!-- J2:style head start (owner W-1) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&amp;family=Space+Grotesk:wght@700&amp;display=swap"><style>:root{--j2-primary:#FFD23F;--j2-secondary:#6B46FF;--j2-accent:#FF4D8D;--j2-background:#120D2E;--j2-surface:#1E1747;--j2-text:#FFFFFF;--j2-muted:#C9C3E8;--j2-font-heading:'Space Grotesk', 'Segoe UI', Arial, sans-serif;--j2-font-body:'Inter', 'Segoe UI', Arial, sans-serif;--j2-space:8px;--j2-section:64px;--j2-radius:16px;}body{margin:0;font-family:var(--j2-font-body);color:var(--j2-text);background:var(--j2-background)}h1,h2,h3,h4{font-family:var(--j2-font-heading)}.j2-btn{display:inline-block;display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 28px;background:#FFD23F;color:#120D2E;border:2px solid #FFD23F;border-radius:999px;font-weight:800;text-decoration:none;cursor:pointer}.j2-btn-secondary{display:inline-block;display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 28px;background:transparent;color:#FFFFFF;border:2px solid #FFD23F;border-radius:999px;font-weight:800;text-decoration:none;cursor:pointer}.j2-card{background:#1E1747;color:#FFFFFF;border:1px solid #3A2F7A;border-radius:16px;padding:20px}</style>
<!-- J2:style head end -->
<!-- J2:W-1 head start (owner W-1) -->
<style>
html{scroll-behavior:smooth}
body{margin:0;background:var(--j2-background);color:var(--j2-text);font-family:var(--j2-font-body)}
section[id]{scroll-margin-top:72px}
*,*::before,*::after{box-sizing:border-box}
img,svg{max-width:100%}
</style>
<!-- J2:W-1 head end -->
</head>
<body>
<!-- J2:W-1 start (owner W-1) -->
<style>
#site-nav{position:sticky;top:0;z-index:50;background:var(--j2-background);border-bottom:2px solid var(--j2-secondary)}
#site-nav .w1-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1200px;margin:0 auto;padding:8px 16px}
#site-nav .w1-brand{display:inline-flex;align-items:center;min-height:48px;font-family:var(--j2-font-heading);font-size:1.5rem;font-weight:700;color:var(--j2-primary);text-decoration:none}
#site-nav .nav-toggle{min-width:48px;min-height:48px;padding:0 16px;background:var(--j2-secondary);color:#fff;border:0;border-radius:999px;font:inherit;font-weight:800;cursor:pointer}
#site-nav .w1-menu{display:none;list-style:none;margin:0;padding:8px 16px 16px;max-width:1200px;margin:0 auto}
#site-nav .w1-menu.is-open{display:block}
#site-nav .w1-menu a{display:flex;align-items:center;min-height:48px;padding:0 8px;color:var(--j2-text);font-weight:600;text-decoration:none;border-bottom:1px solid var(--j2-surface)}
#site-nav .w1-menu a:hover,#site-nav .w1-menu a:focus-visible{color:var(--j2-primary)}
#hero.w1-hero{position:relative;overflow:hidden;padding:48px 20px 64px;background:radial-gradient(circle at 90% 0%,var(--j2-secondary),transparent 55%),radial-gradient(circle at 0% 100%,var(--j2-accent),transparent 45%),var(--j2-background)}
#hero .w1-inner{position:relative;display:grid;gap:32px;max-width:1200px;margin:0 auto}
#hero .w1-eyebrow{margin:0 0 12px;color:var(--j2-primary);font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:.9rem}
#hero h1{margin:0 0 16px;font-family:var(--j2-font-heading);font-size:clamp(2.75rem,13vw,6.5rem);line-height:1;color:var(--j2-text);overflow-wrap:anywhere}
#hero .w1-college{margin:0 0 8px;font-size:clamp(1.15rem,4.5vw,1.75rem);font-weight:800;color:var(--j2-text)}
#hero .w1-dates{display:inline-block;margin:0 0 28px;padding:8px 16px;background:var(--j2-accent);color:#120D2E;border-radius:var(--j2-radius);font-size:clamp(1.05rem,4vw,1.5rem);font-weight:800}
#hero .hero-cta{max-width:100%}
#hero .photo-placeholder{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:4/3;padding:16px;text-align:center;background:var(--j2-surface);color:var(--j2-muted);border:3px dashed var(--j2-primary);border-radius:var(--j2-radius);font-weight:600;overflow-wrap:anywhere}
@media (min-width:900px){
#site-nav .nav-toggle{display:none}
#site-nav .w1-bar{padding-right:0}
#site-nav{display:flex;align-items:center;justify-content:space-between;padding:0 24px}
#site-nav .w1-menu,#site-nav .w1-menu.is-open{display:flex;gap:4px;padding:0;margin:0}
#site-nav .w1-menu a{border-bottom:0;padding:0 12px;border-radius:999px}
#hero.w1-hero{padding:96px 32px}
#hero .w1-inner{grid-template-columns:1.2fr 1fr;align-items:center;gap:48px}
}
</style>
<nav id="site-nav" aria-label="Main">
  <div class="w1-bar">
    <a class="w1-brand" href="#hero">Spark 2026</a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="w1-menu">Menu</button>
  </div>
  <ul class="w1-menu" id="w1-menu">
    <li><a href="#schedule">Schedule</a></li>
    <li><a href="#events">Events</a></li>
    <li><a href="#register">Register</a></li>
    <li><a href="#sponsors">Sponsors</a></li>
    <li><a href="#venue">Venue</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
</nav>
<section id="hero" class="w1-hero">
  <div class="w1-inner">
    <div class="w1-copy">
      <p class="w1-eyebrow">College tech fest</p>
      <h1>Spark 2026</h1>
      <p class="w1-college">Northfield College of Engineering, Pune</p>
      <p class="w1-dates">14 to 16 February 2027</p>
      <div><a class="j2-btn hero-cta" href="#register">Register now</a></div>
    </div>
    <div class="photo-placeholder" role="img" aria-label="Photo placeholder">Photo placeholder: fest photo goes here</div>
  </div>
</section>
<script>
(function(){
  var nav=document.getElementById('site-nav');
  if(!nav)return;
  var btn=nav.querySelector('.nav-toggle');
  var menu=document.getElementById('w1-menu');
  if(!btn||!menu)return;
  function setOpen(open){
    menu.classList.toggle('is-open',open);
    btn.setAttribute('aria-expanded',open?'true':'false');
    btn.textContent=open?'Close':'Menu';
  }
  btn.addEventListener('click',function(){setOpen(!menu.classList.contains('is-open'));});
  menu.addEventListener('click',function(e){if(e.target.closest&&e.target.closest('a'))setOpen(false);});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')setOpen(false);});
})();
</script>
<!-- J2:W-1 end -->
</body>
</html>
