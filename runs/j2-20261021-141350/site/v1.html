<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brew Lab</title>
<!-- J2:style head start (owner W-24) -->
<style>:root{--j2-primary:#4a2e1a;--j2-secondary:#f1e4d3;--j2-accent:#b4531f;--j2-background:#fbf6ef;--j2-surface:#ffffff;--j2-text:#2a1d14;--j2-muted:#6b5a4c;--j2-font-heading:Georgia, 'Times New Roman', serif;--j2-font-body:system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;--j2-space:8px;--j2-section:64px;--j2-radius:12px;}body{margin:0;font-family:var(--j2-font-body);color:var(--j2-text);background:var(--j2-background)}h1,h2,h3,h4{font-family:var(--j2-font-heading)}.j2-btn{display:inline-block;background:#4a2e1a;color:#ffffff;border:2px solid #4a2e1a;min-height:48px;padding:12px 24px;font-weight:600;font-size:1rem;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer}.j2-btn-secondary{display:inline-block;background:transparent;color:#4a2e1a;border:2px solid #4a2e1a;min-height:48px;padding:12px 24px;font-weight:600;font-size:1rem;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer}.j2-card{background:#ffffff;border:1px solid #e3d3bf;border-radius:12px;padding:24px;box-shadow:0 2px 8px rgba(74,46,26,0.08)}</style>
<!-- J2:style head end -->
</head>
<body>
<!-- J2:W-24 start (owner W-24) -->
<section id="shop-name" aria-labelledby="shop-name-title" style="background:var(--j2-secondary,#f1e4d3);padding:48px 16px;text-align:center;box-sizing:border-box;max-width:100%;overflow-wrap:anywhere;">
  <div style="max-width:720px;margin:0 auto;">
    <p style="margin:0 0 8px;color:var(--j2-muted,#6b5a4c);font-family:var(--j2-font-body,system-ui,sans-serif);font-size:1rem;letter-spacing:0.08em;text-transform:uppercase;">Specialty coffee shop</p>
    <h1 id="shop-name-title" style="margin:0 0 16px;color:var(--j2-primary,#4a2e1a);font-family:var(--j2-font-heading,Georgia,serif);font-size:clamp(2.5rem,10vw,4rem);line-height:1.1;">Brew Lab</h1>
    <p style="margin:0 auto 24px;max-width:36ch;color:var(--j2-text,#2a1d14);font-family:var(--j2-font-body,system-ui,sans-serif);font-size:1.125rem;line-height:1.5;">See the menu with prices, check the opening hours and order ahead to collect at the shop.</p>
    <a id="hero-order" class="j2-btn" href="#pre-order">Pre-order for pickup</a>
  </div>
</section>
<!-- J2:W-24 end -->
</body>
</html>
