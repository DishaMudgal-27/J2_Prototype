<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brew Lab</title>
<!-- J2:style head start (owner W-32) -->
<style>:root{--j2-primary:#5a3825;--j2-secondary:#2f4a3a;--j2-accent:#9a4a14;--j2-background:#faf5ee;--j2-surface:#ffffff;--j2-text:#2b1d14;--j2-muted:#6b5646;--j2-font-heading:Georgia, 'Times New Roman', serif;--j2-font-body:system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;--j2-space:8px;--j2-section:64px;--j2-radius:12px;}body{margin:0;font-family:var(--j2-font-body);color:var(--j2-text);background:var(--j2-background)}h1,h2,h3,h4{font-family:var(--j2-font-heading)}.j2-btn{display:inline-block;background:#5a3825;color:#ffffff;border:2px solid #5a3825;min-height:48px;padding:12px 24px;font-weight:600;font-size:1rem;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none}.j2-btn-secondary{display:inline-block;background:transparent;color:#5a3825;border:2px solid #5a3825;min-height:48px;padding:12px 24px;font-weight:600;font-size:1rem;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none}.j2-card{background:#ffffff;border:1px solid #e6d9c8;border-radius:12px;padding:24px;box-shadow:0 2px 8px rgba(43,29,20,0.08)}</style>
<!-- J2:style head end -->
</head>
<body>
<!-- J2:W-32 start (owner W-32) -->
<section id="shop-identity" aria-labelledby="shop-name">
  <style>
    #shop-identity {
      box-sizing: border-box;
      width: 100%;
      max-width: 100%;
      padding: 48px 16px;
      background: var(--j2-background, #faf5ee);
      color: var(--j2-text, #2b1d14);
      font-family: var(--j2-font-body, system-ui, sans-serif);
      text-align: center;
    }
    #shop-identity .shop-identity-inner {
      box-sizing: border-box;
      max-width: 720px;
      margin: 0 auto;
      padding: 32px 20px;
      background: var(--j2-surface, #ffffff);
      border: 1px solid #e6d9c8;
      border-radius: var(--j2-radius, 12px);
      box-shadow: 0 2px 8px rgba(43, 29, 20, 0.08);
    }
    #shop-identity .shop-kicker {
      margin: 0 0 8px;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--j2-accent, #9a4a14);
    }
    #shop-identity #shop-name {
      margin: 0 0 16px;
      font-family: var(--j2-font-heading, Georgia, serif);
      font-size: clamp(2.25rem, 8vw, 3.5rem);
      line-height: 1.1;
      color: var(--j2-primary, #5a3825);
      overflow-wrap: anywhere;
    }
    #shop-identity #shop-address {
      margin: 0;
      font-size: 1.125rem;
      line-height: 1.5;
      color: var(--j2-text, #2b1d14);
      overflow-wrap: anywhere;
    }
    @media (min-width: 768px) {
      #shop-identity { padding: 64px 24px; }
      #shop-identity .shop-identity-inner { padding: 48px 32px; }
    }
  </style>
  <div class="shop-identity-inner">
    <p class="shop-kicker">Specialty coffee shop</p>
    <h1 id="shop-name">Brew Lab</h1>
    <p id="shop-address">12, 100 Feet Road, Indiranagar, Bengaluru 560038</p>
  </div>
</section>
<!-- J2:W-32 end -->
</body>
</html>
