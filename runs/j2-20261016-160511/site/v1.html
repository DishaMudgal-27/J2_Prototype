<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brew Lab</title>
<!-- J2:style head start (owner W-26) -->
<style>:root{--j2-primary:#3E2415;--j2-secondary:#7A4B2A;--j2-accent:#9A5216;--j2-background:#FBF6EF;--j2-surface:#FFFFFF;--j2-text:#2B1B12;--j2-muted:#6B5646;--j2-font-heading:Georgia, 'Times New Roman', serif;--j2-font-body:system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;--j2-space:8px;--j2-section:64px;--j2-radius:12px;}body{margin:0;font-family:var(--j2-font-body);color:var(--j2-text);background:var(--j2-background)}h1,h2,h3,h4{font-family:var(--j2-font-heading)}.j2-btn{display:inline-block;background:#3E2415;color:#FFFFFF;border:2px solid #3E2415;min-height:48px;padding:12px 24px;font-weight:600;}.j2-btn-secondary{display:inline-block;background:transparent;color:#3E2415;border:2px solid #3E2415;min-height:48px;padding:12px 24px;font-weight:600;}.j2-card{background:#FFFFFF;border:1px solid #E6D8C8;box-shadow:0 2px 8px rgba(62,36,21,0.08);padding:24px;}</style>
<!-- J2:style head end -->
</head>
<body>
<!-- J2:W-26 start (owner W-26) -->
<section id="menu" aria-labelledby="menu-heading">
  <style>
    #menu { padding: 64px 16px; background: var(--j2-background, #FBF6EF); color: var(--j2-text, #2B1B12); }
    #menu .menu-wrap { max-width: 640px; margin: 0 auto; box-sizing: border-box; }
    #menu h2 { font-family: var(--j2-font-heading, Georgia, serif); color: var(--j2-primary, #3E2415); font-size: 2rem; line-height: 1.2; margin: 0 0 8px; overflow-wrap: anywhere; }
    #menu .menu-note { color: var(--j2-muted, #6B5646); margin: 0 0 24px; }
    #menu .menu-list { list-style: none; margin: 0; padding: 0; }
    #menu .menu-item { font-family: var(--j2-font-body, system-ui, sans-serif); font-size: 1.125rem; padding: 16px 0; border-bottom: 1px solid #E6D8C8; overflow-wrap: anywhere; }
    #menu .menu-item:last-child { border-bottom: 0; }
    @media (max-width: 400px) { #menu { padding: 48px 16px; } #menu h2 { font-size: 1.625rem; } }
  </style>
  <div class="menu-wrap j2-card">
    <h2 id="menu-heading">Menu</h2>
    <p class="menu-note">Prices in rupees.</p>
    <ul class="menu-list">
      <li class="menu-item">Filter coffee 90</li>
      <li class="menu-item">Cappuccino 160</li>
      <li class="menu-item">Latte 180</li>
      <li class="menu-item">Cold brew 200</li>
      <li class="menu-item">Masala chai 80</li>
      <li class="menu-item">Almond croissant 140</li>
      <li class="menu-item">Banana bread slice 120</li>
    </ul>
  </div>
</section>
<!-- J2:W-26 end -->
</body>
</html>
