<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kaveri Kitchen</title>
<!-- J2:style head start (owner W-1) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&amp;family=Nunito:wght@400;600;700&amp;display=swap"><style>:root{--j2-primary:#9C3D12;--j2-secondary:#2F5D3A;--j2-accent:#E3A72F;--j2-background:#FFF8EC;--j2-surface:#FFFFFF;--j2-text:#2E1F14;--j2-muted:#6B5646;--j2-font-heading:'Fraunces', Georgia, 'Times New Roman', serif;--j2-font-body:'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;--j2-space:8px;--j2-section:64px;--j2-radius:12px;}body{margin:0;font-family:var(--j2-font-body);color:var(--j2-text);background:var(--j2-background)}h1,h2,h3,h4{font-family:var(--j2-font-heading)}.j2-btn{display:inline-block;background:#9C3D12;color:#FFFFFF;border:2px solid #9C3D12;min-height:44px;padding:0 24px;border-radius:999px;font-weight:700;font-size:1rem;cursor:pointer}.j2-btn-secondary{display:inline-block;background:transparent;color:#9C3D12;border:2px solid #9C3D12;min-height:44px;padding:0 24px;border-radius:999px;font-weight:700;font-size:1rem;cursor:pointer}.j2-card{background:#FFFFFF;border:1px solid #EAD7B8;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(94,52,20,0.08)}</style>
<!-- J2:style head end -->
<!-- J2:W-1 head start (owner W-1) -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Kaveri Kitchen, a South Indian restaurant in Kothrud, Pune. See the menu with prices, today's specials, opening hours and book a table on WhatsApp.">
<meta name="theme-color" content="#9C3D12">
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:72px}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;max-width:100%;overflow-x:hidden;overflow-x:clip;background:var(--j2-background,#FFF8EC);color:var(--j2-text,#2E1F14);font-family:var(--j2-font-body,'Nunito',system-ui,sans-serif);font-size:1rem;line-height:1.6}
img,video,svg{max-width:100%;height:auto}
:where(h1,h2,h3,h4){font-family:var(--j2-font-heading,'Fraunces',Georgia,serif);line-height:1.2;color:var(--j2-text,#2E1F14);overflow-wrap:break-word}
:where(p,li,a,td,th,label,button,input,select,textarea){overflow-wrap:break-word}
:where(section[id]){padding:48px 16px}
@media (min-width:768px){:where(section[id]){padding:var(--j2-section,64px) 24px}}
:where(a){color:var(--j2-primary,#9C3D12)}
:where(a,button,input,select,textarea):focus-visible{outline:3px solid var(--j2-secondary,#2F5D3A);outline-offset:2px}
</style>
<!-- J2:W-1 head end -->
</head>
<body>
<!-- J2:W-1 start (owner W-1) -->
<div class="kk-shell">
<style>
.kk-shell{display:block;max-width:100%}
.kk-shell .kk-wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.kk-shell .kk-header{background:var(--j2-surface,#FFFFFF);border-bottom:4px solid var(--j2-accent,#E3A72F);z-index:50}
.kk-shell .kk-bar{max-width:1080px;margin:0 auto;padding:8px 16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 16px}
.kk-shell .kk-brand{font-family:var(--j2-font-heading,'Fraunces',Georgia,serif);font-weight:700;font-size:1.4rem;color:var(--j2-primary,#9C3D12);text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.kk-shell .kk-nav ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:0 4px}
.kk-shell .kk-nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 10px;color:var(--j2-text,#2E1F14);font-weight:600;text-decoration:none;border-radius:8px}
.kk-shell .kk-nav a:hover{color:var(--j2-primary,#9C3D12);text-decoration:underline;text-underline-offset:4px}
@media (min-width:768px){.kk-shell .kk-header{position:sticky;top:0}.kk-shell .kk-nav a{padding:0 14px}}
.kk-shell .kk-hero{background:linear-gradient(165deg,#FFF1D6 0%,#FBE0B8 100%);padding:48px 0 56px;position:relative}
.kk-shell .kk-hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:repeating-linear-gradient(90deg,var(--j2-primary,#9C3D12) 0 16px,var(--j2-accent,#E3A72F) 16px 32px,var(--j2-secondary,#2F5D3A) 32px 48px)}
.kk-shell .kk-kicker{margin:0 0 8px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:.85rem;color:var(--j2-secondary,#2F5D3A)}
.kk-shell .kk-hero h1{margin:0 0 12px;font-size:clamp(2.2rem,9vw,3.8rem);color:var(--j2-primary,#9C3D12)}
.kk-shell .kk-lead{margin:0 0 24px;max-width:36em;font-size:1.125rem;color:var(--j2-text,#2E1F14)}
.kk-shell .kk-actions{display:flex;flex-wrap:wrap;gap:12px}
.kk-shell .j2-btn,.kk-shell .j2-btn-secondary{display:inline-flex;align-items:center;justify-content:center;min-height:44px;text-decoration:none}
.kk-shell .j2-btn-secondary{background:rgba(255,255,255,.6)}
</style>

<!-- Anchors expected from the other sections: menu, specials, photos, reviews, book, visit -->
<header class="kk-header" id="top">
  <div class="kk-bar">
    <a class="kk-brand" href="#top">Kaveri Kitchen</a>
    <nav class="kk-nav" aria-label="Main">
      <ul>
        <li><a href="#menu">Menu</a></li>
        <li><a href="#specials">Specials</a></li>
        <li><a href="#photos">Photos</a></li>
        <li><a href="#reviews">Reviews</a></li>
        <li><a href="#book">Book</a></li>
        <li><a href="#visit">Visit</a></li>
      </ul>
    </nav>
  </div>
</header>

<div class="kk-hero">
  <div class="kk-wrap">
    <p class="kk-kicker">South Indian restaurant &middot; Kothrud, Pune</p>
    <h1>Kaveri Kitchen</h1>
    <p class="kk-lead">Welcome! Pull up a chair, have a look at the menu and book your table in a minute.</p>
    <div class="kk-actions">
      <a class="j2-btn" href="#book">Book a table</a>
      <a class="j2-btn j2-btn-secondary" href="#menu">See the menu</a>
    </div>
  </div>
</div>

<script>
(function () {
  function tidyLinks() {
    var links = document.querySelectorAll('.kk-shell a[href^="#"]');
    for (var i = 0; i < links.length; i++) {
      var a = links[i];
      var id = a.getAttribute('href').slice(1);
      if (id && !document.getElementById(id)) {
        var li = a.closest('li');
        (li || a).remove();
      }
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', tidyLinks);
  } else {
    tidyLinks();
  }
})();
</script>
</div>
<!-- J2:W-1 end -->
</body>
</html>
