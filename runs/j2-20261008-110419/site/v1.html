<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thread &amp; Loom</title>
<!-- J2:style head start (owner W-1) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&amp;family=Nunito+Sans:wght@400;600;700&amp;display=swap"><style>:root{--j2-primary:#8A3B1E;--j2-secondary:#4F5D3A;--j2-accent:#B8863B;--j2-background:#FAF5EC;--j2-surface:#F1E7D6;--j2-text:#2E2418;--j2-muted:#6B5B4B;--j2-font-heading:'Cormorant Garamond', Georgia, 'Times New Roman', serif;--j2-font-body:'Nunito Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;--j2-space:8px;--j2-section:64px;--j2-radius:12px;}body{margin:0;font-family:var(--j2-font-body);color:var(--j2-text);background:var(--j2-background)}h1,h2,h3,h4{font-family:var(--j2-font-heading)}.j2-btn{display:inline-block;background:#8A3B1E;color:#FFFFFF;border:2px solid #8A3B1E;min-height:48px;padding:12px 24px;font-weight:700;letter-spacing:.02em;border-radius:12px}.j2-btn-secondary{display:inline-block;background:transparent;color:#4F5D3A;border:2px solid #4F5D3A;min-height:48px;padding:12px 24px;font-weight:700;letter-spacing:.02em;border-radius:12px}.j2-card{background:#FFFFFF;border:1px solid #E3D5BD;border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(46,36,24,.08)}</style>
<!-- J2:style head end -->
<!-- J2:W-1 head start (owner W-1) -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#8A3B1E">
<!-- J2:W-1 head end -->
</head>
<body>
<!-- J2:W-1 start (owner W-1) -->
<!-- W-1: earthy theme and mobile base (no visible content; shared base styles for all sections) -->
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:72px;overflow-x:hidden}
body{margin:0;width:100%;max-width:100%;overflow-x:clip;font-family:var(--j2-font-body,'Nunito Sans',system-ui,sans-serif);font-size:16px;line-height:1.6;background:var(--j2-background,#FAF5EC);color:var(--j2-text,#2E2418);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--j2-font-heading,'Cormorant Garamond',Georgia,serif);line-height:1.2;margin:0 0 .5em;color:var(--j2-text,#2E2418);overflow-wrap:anywhere}
h1{font-size:clamp(2rem,7vw,3.25rem)}
h2{font-size:clamp(1.6rem,5vw,2.4rem)}
h3{font-size:clamp(1.2rem,3.5vw,1.5rem)}
p{margin:0 0 1em;overflow-wrap:anywhere}
a{color:var(--j2-primary,#8A3B1E)}
img,svg,video,iframe{max-width:100%;height:auto}
table{max-width:100%}
.j2-container{width:100%;max-width:1120px;margin-inline:auto;padding-inline:16px}
.j2-section{padding-block:clamp(40px,8vw,64px)}
.j2-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr))}
.j2-grid>*,.j2-container>*{min-width:0}
.j2-table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.j2-btn,.j2-btn-secondary{display:inline-flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;cursor:pointer;min-height:44px;font-family:inherit;font-size:1rem;max-width:100%}
.j2-photo{display:grid;place-items:center;width:100%;aspect-ratio:4/5;background:repeating-linear-gradient(45deg,#F1E7D6,#F1E7D6 10px,#EADCC4 10px,#EADCC4 20px);border:1px dashed #B8863B;border-radius:var(--j2-radius,12px);color:var(--j2-muted,#6B5B4B);font-size:.85rem;text-align:center;padding:8px}
.j2-photo::after{content:"Photo coming soon"}
select,input,button,textarea{font-family:inherit;font-size:16px;max-width:100%}
select,input[type="text"],input[type="number"],input[type="range"]{min-height:44px}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--j2-accent,#B8863B);outline-offset:2px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
</style>
<!-- J2:W-1 end -->
</body>
</html>
