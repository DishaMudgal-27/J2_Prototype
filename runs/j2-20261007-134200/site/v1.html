<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brew Lab</title>
<!-- J2:W-1 head start (owner W-1) -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Brew Lab, a cafe on 100 Feet Road, Indiranagar, Bengaluru. Menu, hours, loyalty and pickup pre-orders.">
<style>
  :root {
    --bl-bg: #faf6f0;
    --bl-surface: #ffffff;
    --bl-ink: #2b1d14;
    --bl-muted: #6b5a4e;
    --bl-accent: #8a4b22;
    --bl-line: #e6dccf;
    --bl-radius: 12px;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bl-bg);
    color: var(--bl-ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 1rem;
    line-height: 1.5;
    overflow-wrap: anywhere;
  }
  img, svg, video { max-width: 100%; height: auto; }
  h1, h2, h3, p, ul { margin-top: 0; }
  a { color: var(--bl-accent); }
  .wrap { width: 100%; max-width: 960px; margin: 0 auto; padding: 0 1rem; }
  .bl-section { padding: 2rem 0; }
  .bl-section h2 { font-size: 1.5rem; margin-bottom: 1rem; }
  @media (min-width: 768px) {
    .wrap { padding: 0 1.5rem; }
    .bl-section { padding: 3rem 0; }
    .bl-section h2 { font-size: 1.875rem; }
  }
</style>
<!-- J2:W-1 head end -->
</head>
<body>
<!-- J2:W-1 start (owner W-1) -->
<header class="bl-hero">
  <div class="wrap">
    <h1>Brew Lab</h1>
    <p>Coffee on 100 Feet Road, Indiranagar, Bengaluru.</p>
  </div>
</header>

<main>
<section id="menu" class="bl-section bl-menu" aria-labelledby="menu-title">
  <div class="wrap">
    <h2 id="menu-title">Menu</h2>
    <div class="bl-menu-grid">
      <div class="bl-menu-group">
        <h3>Coffee</h3>
        <ul class="bl-menu-list">
          <li><span class="bl-item">Espresso</span><span class="bl-price">₹120</span></li>
          <li><span class="bl-item">Cappuccino</span><span class="bl-price">₹180</span></li>
          <li><span class="bl-item">Pour-over</span><span class="bl-price">₹220</span></li>
        </ul>
      </div>
      <div class="bl-menu-group">
        <h3>Cold</h3>
        <ul class="bl-menu-list">
          <li><span class="bl-item">Cold brew</span><span class="bl-price">₹200</span></li>
        </ul>
      </div>
      <div class="bl-menu-group">
        <h3>Food</h3>
        <ul class="bl-menu-list">
          <li><span class="bl-item">Croissant</span><span class="bl-price">₹150</span></li>
          <li><span class="bl-item">Banana bread</span><span class="bl-price">₹130</span></li>
        </ul>
      </div>
    </div>
  </div>
</section>
<!-- Other sections attach below this line, inside main. -->
</main>

<style>
  .bl-hero {
    background: var(--bl-ink);
    color: #fff;
    padding: 2rem 0 1.75rem;
  }
  .bl-hero h1 { font-size: 2rem; margin-bottom: .25rem; letter-spacing: .02em; }
  .bl-hero p { margin-bottom: 0; color: #e9dccd; }
  .bl-menu-grid { display: grid; grid-template-columns: 1fr; gap: 1rem; }
  .bl-menu-group {
    background: var(--bl-surface);
    border: 1px solid var(--bl-line);
    border-radius: var(--bl-radius);
    padding: 1rem;
    min-width: 0;
  }
  .bl-menu-group h3 {
    margin-bottom: .5rem;
    font-size: 1.125rem;
    color: var(--bl-accent);
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  .bl-menu-list { list-style: none; padding: 0; margin: 0; }
  .bl-menu-list li {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    padding: .6rem 0;
    border-top: 1px solid var(--bl-line);
  }
  .bl-menu-list li:first-child { border-top: 0; }
  .bl-item { min-width: 0; }
  .bl-price { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
  @media (min-width: 768px) {
    .bl-hero { padding: 3rem 0 2.5rem; }
    .bl-hero h1 { font-size: 2.75rem; }
    .bl-menu-grid { grid-template-columns: repeat(3, 1fr); gap: 1.25rem; }
  }
</style>
<!-- J2:W-1 end -->
</body>
</html>
