<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brew Lab</title>
</head>
<body>
<!-- J2:W-1 start (owner W-1) -->
<header class="bl-header" id="top">
  <style>
    .bl-header { background: #3b2416; color: #fdf6ec; padding: 1rem 1rem 0.75rem; text-align: center; box-sizing: border-box; max-width: 100%; }
    .bl-header *, .bl-header *::before, .bl-header *::after { box-sizing: border-box; }
    .bl-header .bl-name { margin: 0; font-size: 2rem; line-height: 1.2; letter-spacing: 0.04em; overflow-wrap: anywhere; }
    .bl-header .bl-tagline { margin: 0.25rem 0 0.75rem; font-size: 1rem; color: #e8d3b9; }
    .bl-header .bl-nav ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 0.25rem 0.5rem; }
    .bl-header .bl-nav a { display: inline-block; padding: 0.5rem 0.75rem; color: #fdf6ec; text-decoration: none; border-radius: 4px; }
    .bl-header .bl-nav a:hover, .bl-header .bl-nav a:focus { background: #5a3a24; text-decoration: underline; }
    @media (min-width: 768px) {
      .bl-header { padding: 1.5rem 2rem 1rem; }
      .bl-header .bl-name { font-size: 2.75rem; }
    }
  </style>
  <h1 class="bl-name">Brew Lab</h1>
  <p class="bl-tagline">A cafe in Indiranagar, Bengaluru</p>
  <nav class="bl-nav" aria-label="Main">
    <ul>
      <li><a href="#menu">Menu</a></li>
      <li><a href="#timings">Timings</a></li>
      <li><a href="#location">Location</a></li>
      <li><a href="#gallery">Gallery</a></li>
      <li><a href="#stories">Coffee stories</a></li>
    </ul>
  </nav>
</header>
<!-- J2:W-1 end -->
<!-- J2:W-2 start (owner W-2) -->
<section class="bl-menu" id="menu" aria-labelledby="bl-menu-title">
  <style>
    .bl-menu { background: #fdf6ec; color: #3b2416; padding: 2rem 1rem; box-sizing: border-box; max-width: 100%; }
    .bl-menu *, .bl-menu *::before, .bl-menu *::after { box-sizing: border-box; }
    .bl-menu .bl-menu-title { margin: 0 0 1rem; text-align: center; font-size: 1.75rem; line-height: 1.2; }
    .bl-menu .bl-menu-list { list-style: none; margin: 0 auto; padding: 0; max-width: 32rem; }
    .bl-menu .bl-menu-item { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; padding: 0.75rem 0; border-bottom: 1px solid #e0cbb0; }
    .bl-menu .bl-menu-item:last-child { border-bottom: 0; }
    .bl-menu .bl-menu-name { font-size: 1.1rem; overflow-wrap: anywhere; }
    .bl-menu .bl-menu-price { font-weight: 700; white-space: nowrap; }
    @media (min-width: 768px) {
      .bl-menu { padding: 3rem 2rem; }
      .bl-menu .bl-menu-title { font-size: 2.25rem; }
    }
  </style>
  <h2 class="bl-menu-title" id="bl-menu-title">Menu</h2>
  <ul class="bl-menu-list">
    <li class="bl-menu-item"><span class="bl-menu-name">Espresso</span><span class="bl-menu-price">₹120</span></li>
    <li class="bl-menu-item"><span class="bl-menu-name">Cappuccino</span><span class="bl-menu-price">₹180</span></li>
    <li class="bl-menu-item"><span class="bl-menu-name">Cold brew</span><span class="bl-menu-price">₹200</span></li>
    <li class="bl-menu-item"><span class="bl-menu-name">Pour-over</span><span class="bl-menu-price">₹220</span></li>
    <li class="bl-menu-item"><span class="bl-menu-name">Croissant</span><span class="bl-menu-price">₹150</span></li>
    <li class="bl-menu-item"><span class="bl-menu-name">Banana bread</span><span class="bl-menu-price">₹130</span></li>
  </ul>
</section>
<!-- J2:W-2 end -->
</body>
</html>
