<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kaveri Kitchen</title>
<!-- J2:style head start (owner W-1) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&amp;family=Nunito:wght@400;600;700&amp;display=swap"><style>:root{--j2-primary:#8B2E1F;--j2-secondary:#2F6B3A;--j2-accent:#E8A317;--j2-background:#FFF8EC;--j2-surface:#FFFFFF;--j2-text:#2B1B14;--j2-muted:#6B5547;--j2-font-heading:'Lora', Georgia, serif;--j2-font-body:'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;--j2-space:8px;--j2-section:64px;--j2-radius:12px;}body{margin:0;font-family:var(--j2-font-body);color:var(--j2-text);background:var(--j2-background)}h1,h2,h3,h4{font-family:var(--j2-font-heading)}.j2-btn{display:inline-block;background:#8B2E1F;color:#FFFFFF;border:2px solid #8B2E1F;min-height:48px;padding:12px 24px;border-radius:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer}.j2-btn-secondary{display:inline-block;background:transparent;color:#8B2E1F;border:2px solid #8B2E1F;min-height:48px;padding:12px 24px;border-radius:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer}.j2-card{background:#FFFFFF;border:1px solid #EBD9BF;border-radius:12px;padding:24px;box-shadow:0 2px 8px rgba(43,27,20,0.08)}</style>
<!-- J2:style head end -->
<!-- J2:W-1 head start (owner W-1) -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaveri Kitchen | South Indian Restaurant in Kothrud, Pune</title>
<meta name="description" content="Kaveri Kitchen is a South Indian restaurant at Karve Road, Kothrud, Pune. See the menu with prices, today's specials, and book a table on WhatsApp.">
<!-- J2:W-1 head end -->
</head>
<body>
<!-- J2:W-1 start (owner W-1) -->
<style>
  html { scroll-behavior: smooth; }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--j2-background, #FFF8EC); color: var(--j2-text, #2B1B14); font-family: var(--j2-font-body, system-ui, sans-serif); line-height: 1.6; overflow-wrap: break-word; }
  section[id] { scroll-margin-top: 16px; }
  .kk-header { background: var(--j2-surface, #FFFFFF); border-bottom: 4px solid var(--j2-accent, #E8A317); text-align: center; padding: 24px 16px 8px; }
  .kk-header-inner { max-width: 1100px; margin: 0 auto; }
  .kk-brand { margin: 0; font-family: var(--j2-font-heading, Georgia, serif); font-size: 2.25rem; line-height: 1.2; color: var(--j2-primary, #8B2E1F); }
  .kk-tagline { margin: 4px 0 16px; color: var(--j2-muted, #6B5547); font-size: 1.05rem; }
  .kk-cta { margin-bottom: 8px; }
  .kk-nav ul { list-style: none; margin: 0; padding: 8px 0 8px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .kk-nav a { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; min-width: 44px; padding: 8px 16px; border-radius: 999px; color: var(--j2-primary, #8B2E1F); font-weight: 700; text-decoration: none; border: 1px solid transparent; }
  .kk-nav a:hover, .kk-nav a:focus-visible { background: var(--j2-background, #FFF8EC); border-color: var(--j2-primary, #8B2E1F); outline: none; }
  @media (max-width: 480px) {
    .kk-brand { font-size: 1.85rem; }
    .kk-nav ul { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
    .kk-nav a { padding: 8px 4px; width: 100%; }
    .kk-cta .j2-btn { width: 100%; }
  }
</style>
<header class="kk-header" id="top">
  <div class="kk-header-inner">
    <h1 class="kk-brand">Kaveri Kitchen</h1>
    <p class="kk-tagline">South Indian restaurant in Kothrud, Pune</p>
    <div class="kk-cta"><a class="j2-btn" href="#booking">Book a table</a></div>
    <nav class="kk-nav" aria-label="Main">
      <ul>
        <li><a href="#menu">Menu</a></li>
        <li><a href="#specials">Specials</a></li>
        <li><a href="#booking">Booking</a></li>
        <li><a href="#photos">Photos</a></li>
        <li><a href="#reviews">Reviews</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </div>
</header>
<!-- J2:W-1 end -->
</body>
</html>
