<style>
:root{--b:#0b5c7a;--bg:#f4f9fb;--ink:#1f2937;--line:#d9e2e8}
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 system-ui,"Noto Sans Kannada","Noto Sans Devanagari",sans-serif;color:var(--ink);background:var(--bg)}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);z-index:5}
.bar{display:flex;flex-wrap:wrap;gap:.4rem 1rem;align-items:center;justify-content:space-between;padding:.5rem 1rem;max-width:1000px;margin:auto}
.brand{font-weight:700;color:var(--b);font-size:1.1rem}
nav{display:flex;flex-wrap:wrap;gap:.2rem .8rem}
nav a{color:var(--ink);text-decoration:none;padding:.25rem .1rem;border-bottom:2px solid transparent}
nav a:hover,nav a:focus{border-color:var(--b);outline:none}
.lang button{border:1px solid var(--b);background:#fff;color:var(--b);padding:.25rem .6rem;cursor:pointer;font:inherit}
.lang button[aria-pressed="true"]{background:var(--b);color:#fff}
#rev,#draft{text-align:center;padding:.3rem .6rem;font-size:.9rem}
#rev{background:#fff3b0;color:#7a5c00}
#draft{background:var(--bg);color:#5b6770}
#rev[hidden]{display:none}
section{max-width:1000px;margin:auto;padding:2rem 1rem;scroll-margin-top:8rem}
h1,h2,h3{color:var(--b);line-height:1.25}
.ph{background:#fff3b0;color:#7a5c00;border:1px dashed #7a5c00;padding:0 .3rem;border-radius:3px;font-size:.92em}
.hero{background:#fff;border:1px solid var(--line);border-radius:8px;padding:1.5rem}
.btn{display:inline-block;background:var(--b);color:#fff;text-decoration:none;border:0;padding:.6rem 1rem;border-radius:5px;font:inherit;cursor:pointer;margin:.3rem .4rem .3rem 0}
.btn.alt{background:#fff;color:var(--b);border:1px solid var(--b)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1rem}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:1rem}
.photo{height:90px;display:flex;align-items:center;justify-content:center;background:var(--bg);border:1px dashed var(--line);margin-bottom:.6rem}
form{background:#fff;border:1px solid var(--line);border-radius:8px;padding:1rem;display:grid;gap:.8rem;max-width:620px}
label{display:grid;gap:.2rem;font-weight:600}
input,select,textarea{font:inherit;padding:.45rem;border:1px solid #b6c2cb;border-radius:4px;font-weight:400}
label.chk{display:flex;gap:.5rem;align-items:flex-start;font-weight:400}
.note{background:#fff;border-left:4px solid var(--b);padding:.6rem .8rem;max-width:620px}
#notice{background:#fde8e6;border-left:4px solid #b42318;padding:.6rem .8rem;max-width:620px}
#notice[hidden]{display:none}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.col{background:#fff;border:2px solid #b42318;border-radius:8px;padding:1rem}
.col h3{color:#b42318;margin-top:0}
.big{font-size:1.5rem;font-weight:700;margin:.3rem 0}
.rev{background:#fff3b0;color:#7a5c00;font-size:.85rem;padding:.2rem .4rem;border-radius:3px}
footer{text-align:center;padding:1.5rem 1rem;color:#5b6770;font-size:.9rem}
@media(max-width:800px){.cols{grid-template-columns:1fr}}
</style>
</head>

<header>
<div class="bar">
<div class="brand"><span data-i18n="brand"></span>, <span data-i18n="city"></span></div>

<a href="#home" data-i18n="nav_home"></a>

<div id="draft" data-i18n="draft"></div>

<main>
<section id="home">

<h1 data-i18n="home_h"></h1>

<a class="btn alt" href="#emergency" data-i18n="cta_emerg"></a>
</div>
</section>

<section id="book">
<h2 data-i18n="book_h"></h2>
<p class="note" data-i18n="book_note"></p>
<br>
<form id="bookForm">
<label><span data-i18n="f_name"></span><input name="name" required autocomplete="off"></label>
<label><span data-i18n="f_phone"></span><input name="phone" type="tel" required autocomplete="off"></label>
<label><span data-i18n="f_date"></span><input name="date" type="date" required></label>
<label><span data-i18n="f_time"></span>
<select name="time">
<option value="Any" data-i18n="t_any"></option>
<option value="Morning" data-i18n="t_morn"></option>
<option value="Afternoon" data-i18n="t_aft"></option>
<option value="Evening" data-i18n="t_eve"></option>
</select></label>
<label><span data-i18n="f_spec"></span><input name="spec" autocomplete="off"></label>
<label><span data-i18n="f_reason"></span><textarea name="reason" rows="3" maxlength="200"></textarea></label>
<label class="chk"><input type="checkbox" required><span data-i18n="f_consent"></span></label>
<div>
<button class="btn" type="submit" name="mode" value="wa" data-i18n="b_wa"></button>
<button class="btn alt" type="submit" name="mode" value="tel" data-i18n="b_tel"></button>
</div>
</form>
<p id="notice" role="alert" hidden data-i18n="notice_ph"></p>
</section>

<section id="emergency">
<h2 data-i18n="nav_emerg"></h2>
<div class="cols">
<div class="col" data-fix="en" lang="en">
<h3 data-i18n="nav_emerg"></h3>
<p data-i18n="em_call"></p>
<p class="big" data-i18n="em_num"></p>
<p><b data-i18n="em_addr_l"></b> <span data-i18n="em_addr"></span></p>
<ol><li data-i18n="em_s1"></li><li data-i18n="em_s2"></li><li data-i18n="em_s3"></li></ol>
<p data-i18n="em_warn"></p>
</div>
<div class="col" data-fix="kn" lang="kn">
<h3 data-i18n="nav_emerg"></h3>
<p data-i18n="em_call"></p>
<p class="big" data-i18n="em_num"></p>
<p><b data-i18n="em_addr_l"></b> <span data-i18n="em_addr"></span></p>
<ol><li data-i18n="em_s1"></li><li data-i18n="em_s2"></li><li data-i18n="em_s3"></li></ol>
<p data-i18n="em_warn"></p>
<p class="rev" data-i18n="rev_banner"></p>
</div>
<div class="col" data-fix="hi" lang="hi">
<h3 data-i18n="nav_emerg"></h3>
<p data-i18n="em_call"></p>
<p class="big" data-i18n="em_num"></p>
<p><b data-i18n="em_addr_l"></b> <span data-i18n="em_addr"></span></p>
<ol><li data-i18n="em_s1"></li><li data-i18n="em_s2"></li><li data-i18n="em_s3"></li></ol>
<p data-i18n="em_warn"></p>
<p class="rev" data-i18n="rev_banner"></p>
</div>
</div>
</section>

<section id="doctors">
<h2 data-i18n="doc_h"></h2>
<p class="note" data-i18n="doc_note"></p>
<br>
<div class="grid" id="docGrid"></div>
</section>

<section id="blog">
<h2 data-i18n="blog_h"></h2>
<p class="note" data-i18n="blog_note"></p>
<br>
<div class="grid" id="postGrid"></div>
</section>
</main>

<footer data-i18n="foot"></footer>

function ph(s){return s.replace(/\[\[(.+?)\]\]/g,'<span class="ph">[PLACEHOLDER: $1]</span>');}

function cards(){
var d="",p="",i;
for(i=0;i<4;i++){d+='<div class="card"><div class="photo" data-i18n="d_photo"></div><h3 data-i18n="d_name"></h3><p data-i18n="d_spec"></p><p data-i18n="d_cred"></p></div>';}
for(i=0;i<3;i++){p+='<div class="card"><h3 data-i18n="p_title"></h3><p data-i18n="p_date"></p><p data-i18n="p_sum"></p></div>';}
document.getElementById("docGrid").innerHTML=d;
document.getElementById("postGrid").innerHTML=p;
}

var cur="en";
function setLang(l){
cur=l;
document.documentElement.lang=l;
document.querySelectorAll("[data-i18n]").forEach(function(el){
var fx=el.closest("[data-fix]");
var lg=fx?fx.getAttribute("data-fix"):l;
el.innerHTML=ph(T[lg][el.getAttribute("data-i18n")]);
});
document.querySelectorAll(".lang button").forEach(function(b){
b.setAttribute("aria-pressed",b.getAttribute("data-l")===l?"true":"false");
});
document.getElementById("rev").hidden=(l==="en");
}

cards();
setLang("en");
document.querySelectorAll(".lang button").forEach(function(b){
b.addEventListener("click",function(){setLang(b.getAttribute("data-l"));});
});

var form=document.getElementById("bookForm");
form.addEventListener("submit",function(e){
e.preventDefault();
var mode=(e.submitter&&e.submitter.value)||"wa";
var f=new FormData(form);
var msg="Visit request (CityCare website)\n"+
"Name: "+f.get("name")+"\n"+
"Callback phone: "+f.get("phone")+"\n"+
"Preferred date: "+f.get("date")+"\n"+
"Preferred time: "+f.get("time")+"\n"+
"Specialty/doctor: "+(f.get("spec")||"-")+"\n"+
"Reason: "+(f.get("reason")||"-");
var num=mode==="tel"?CFG.callback:CFG.whatsapp;
var note=document.getElementById("notice");
if(!/^\+?\d{8,15}$/.test(num)){note.hidden=false;return;}
note.hidden=true;
if(mode==="tel"){window.location.href="tel:"+num;}
else{window.open("https://wa.me/"+num.replace("+","")+"?text="+encodeURIComponent(msg),"_blank","noopener");}
});
</script>
