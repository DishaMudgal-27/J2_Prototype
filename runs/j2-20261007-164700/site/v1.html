<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brew Lab</title>
<!-- J2:W-1 head start (owner W-1) -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Brew Lab, a cafe on 100 Feet Road, Indiranagar, Bengaluru. Menu, timings, location, photo gallery and coffee stories.">
<title>Brew Lab | Cafe in Indiranagar, Bengaluru</title>
<script>if(!document.title){document.title="Brew Lab | Cafe in Indiranagar, Bengaluru";}</script>
<style>
:root{
  --bl-bg:#faf4ec;
  --bl-surface:#fffaf3;
  --bl-text:#2b1d14;
  --bl-muted:#5c4636;
  --bl-dark:#3b2415;
  --bl-accent:#7a4a2b;
  --bl-line:#dccbb6;
  --bl-cream:#f7ead8;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;
  background:var(--bl-bg);
  color:var(--bl-text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:1rem;
  line-height:1.6;
  overflow-wrap:break-word;
  overflow-x:hidden;
}
img,svg,video,iframe{max-width:100%;height:auto}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.2;margin:0 0 .75rem;color:var(--bl-dark)}
h2{font-size:1.75rem}
h3{font-size:1.2rem}
p{margin:0 0 1rem}
a{color:var(--bl-accent)}
a:focus-visible{outline:3px solid var(--bl-accent);outline-offset:2px}
section{
  width:100%;
  max-width:960px;
  margin:0 auto;
  padding:2.5rem 1rem;
  scroll-margin-top:1rem;
}
@media (min-width:768px){
  section{padding:3.5rem 1.5rem}
  h2{font-size:2rem}
}

/* W-1: header and nav */
.bl-header{background:var(--bl-dark);color:var(--bl-cream);padding:2.5rem 1rem 0;text-align:center}
.bl-header-inner{max-width:960px;margin:0 auto}
.bl-header h1{color:var(--bl-cream);font-size:2.5rem;margin:0 0 .5rem}
.bl-tagline{margin:0 auto 1.5rem;max-width:36rem;color:var(--bl-cream)}
.bl-nav{border-top:1px solid rgba(247,234,216,.25)}
.bl-nav ul{list-style:none;margin:0;padding:.5rem 0;display:flex;flex-wrap:wrap;justify-content:center;gap:.25rem .5rem}
.bl-nav a{
  display:inline-block;
  padding:.6rem .9rem;
  color:var(--bl-cream);
  text-decoration:none;
  border-radius:999px;
  font-weight:600;
}
.bl-nav a:hover,.bl-nav a:focus-visible{background:var(--bl-cream);color:var(--bl-dark);outline-offset:0}
@media (min-width:768px){
  .bl-header{padding-top:3.5rem}
  .bl-header h1{font-size:3.5rem}
}

/* W-1: menu */
.bl-menu-list{list-style:none;margin:0;padding:0;background:var(--bl-surface);border:1px solid var(--bl-line);border-radius:12px}
.bl-menu-list li{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:1rem;
  padding:.9rem 1.1rem;
  border-bottom:1px dashed var(--bl-line);
  font-size:1.1rem;
}
.bl-menu-list li:last-child{border-bottom:0}
.bl-item{font-weight:600}
.bl-price{white-space:nowrap;color:var(--bl-accent);font-weight:700}
</style>
<!-- J2:W-1 head end -->
</head>
<body>
<!-- J2:W-1 start (owner W-1) -->
<header class="bl-header" id="top">
  <div class="bl-header-inner">
    <h1>Brew Lab</h1>
    <p class="bl-tagline">A cafe on 100 Feet Road, Indiranagar, Bengaluru.</p>
    <nav class="bl-nav" aria-label="Main">
      <ul>
        <li><a href="#menu">Menu</a></li>
        <li><a href="#timings">Timings</a></li>
        <li><a href="#location">Location</a></li>
        <li><a href="#gallery">Gallery</a></li>
        <li><a href="#stories">Stories</a></li>
      </ul>
    </nav>
  </div>
</header>

<section id="menu" aria-labelledby="menu-title">
  <h2 id="menu-title">Menu</h2>
  <ul class="bl-menu-list">
    <li><span class="bl-item">Espresso</span><span class="bl-price">₹120</span></li>
    <li><span class="bl-item">Cappuccino</span><span class="bl-price">₹180</span></li>
    <li><span class="bl-item">Cold brew</span><span class="bl-price">₹200</span></li>
    <li><span class="bl-item">Pour-over</span><span class="bl-price">₹220</span></li>
    <li><span class="bl-item">Croissant</span><span class="bl-price">₹150</span></li>
    <li><span class="bl-item">Banana bread</span><span class="bl-price">₹130</span></li>
  </ul>
</section>
<!-- J2:W-1 end -->
</body>
</html>
