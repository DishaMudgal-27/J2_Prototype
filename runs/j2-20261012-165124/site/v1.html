<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spark 2026</title>
<!-- J2:style head start (owner W-1) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap"><style>:root{--j2-primary:#FFD60A;--j2-secondary:#22D3EE;--j2-accent:#FF3D9A;--j2-background:#0B0B1A;--j2-surface:#171730;--j2-text:#F5F5FF;--j2-muted:#B4B4D0;--j2-font-heading:'Space Grotesk', 'Segoe UI', system-ui, sans-serif;--j2-font-body:'Inter', 'Segoe UI', system-ui, sans-serif;--j2-space:8px;--j2-section:64px;--j2-radius:14px;}body{margin:0;font-family:var(--j2-font-body);color:var(--j2-text);background:var(--j2-background)}h1,h2,h3,h4{font-family:var(--j2-font-heading)}.j2-btn{display:inline-block;background:#FFD60A;color:#0B0B1A;border:2px solid #FFD60A;min-height:48px;padding:12px 24px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer}.j2-btn-secondary{display:inline-block;background:transparent;color:#22D3EE;border:2px solid #22D3EE;min-height:48px;padding:12px 24px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer}.j2-card{background:#171730;border:1px solid #2C2C52;padding:24px;color:#F5F5FF}</style>
<!-- J2:style head end -->
<!-- J2:W-1 head start (owner W-1) -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{background:var(--j2-background,#0B0B1A);color:var(--j2-text,#F5F5FF);font-family:var(--j2-font-body,'Inter',system-ui,sans-serif);line-height:1.6}
img,svg{max-width:100%}
</style>
<!-- J2:W-1 head end -->
</head>
<body>
<!-- J2:W-1 start (owner W-1) -->
<section id="hero">
<style>
#hero{position:relative;overflow:hidden;padding:48px 20px 56px;background:radial-gradient(circle at 15% 10%,rgba(255,61,154,.28),transparent 45%),radial-gradient(circle at 90% 30%,rgba(34,211,238,.22),transparent 45%),var(--j2-background,#0B0B1A)}
#hero .hero-inner{max-width:1100px;margin:0 auto;display:grid;gap:32px;align-items:center}
#hero .hero-eyebrow{display:inline-block;margin:0 0 16px;padding:6px 14px;border:1px solid var(--j2-secondary,#22D3EE);border-radius:999px;color:var(--j2-secondary,#22D3EE);font-size:.85rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
#hero h1{margin:0 0 16px;font-family:var(--j2-font-heading,'Space Grotesk',sans-serif);font-size:clamp(2.75rem,13vw,5.75rem);line-height:1;font-weight:700;letter-spacing:-.02em;overflow-wrap:break-word;background:linear-gradient(90deg,var(--j2-primary,#FFD60A),var(--j2-accent,#FF3D9A));-webkit-background-clip:text;background-clip:text;color:transparent}
#hero .hero-college{margin:0 0 8px;font-family:var(--j2-font-heading,'Space Grotesk',sans-serif);font-size:clamp(1.15rem,5vw,1.75rem);font-weight:700;overflow-wrap:break-word}
#hero .hero-dates{margin:0;font-size:clamp(1.05rem,4.5vw,1.4rem);font-weight:600;color:var(--j2-primary,#FFD60A)}
#hero .hero-copy{min-width:0}
#hero .photo-placeholder{display:flex;align-items:center;justify-content:center;text-align:center;width:100%;aspect-ratio:4/3;padding:16px;border:2px dashed var(--j2-secondary,#22D3EE);border-radius:var(--j2-radius,14px);background:repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 14px,rgba(255,255,255,.08) 14px 28px);color:var(--j2-muted,#B4B4D0);font-weight:600;letter-spacing:.04em}
@media (min-width:800px){
#hero{padding:88px 32px 96px}
#hero .hero-inner{grid-template-columns:1.1fr .9fr;gap:56px}
}
</style>
<div class="hero-inner">
<div class="hero-copy">
<p class="hero-eyebrow">College tech fest</p>
<h1>Spark 2026</h1>
<p class="hero-college">Northfield College of Engineering, Pune</p>
<p class="hero-dates">14 to 16 February 2027</p>
</div>
<div class="photo-placeholder" role="img" aria-label="Photo placeholder">Photo placeholder</div>
</div>
</section>
<!-- J2:W-1 end -->
</body>
</html>
