<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thread &amp; Loom</title>
<!-- J2:style head start (owner W-1) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&amp;family=Nunito+Sans:wght@400;600;700&amp;display=swap"><style>:root{--j2-primary:#7A3B1E;--j2-secondary:#4F5D2F;--j2-accent:#B5763A;--j2-background:#F7F1E8;--j2-surface:#FFFDF9;--j2-text:#2B2118;--j2-muted:#6B5B4D;--j2-font-heading:'Cormorant Garamond', Georgia, serif;--j2-font-body:'Nunito Sans', 'Segoe UI', Arial, sans-serif;--j2-space:8px;--j2-section:64px;--j2-radius:12px;}body{margin:0;font-family:var(--j2-font-body);color:var(--j2-text);background:var(--j2-background)}h1,h2,h3,h4{font-family:var(--j2-font-heading)}.j2-btn{display:inline-block;background:#7A3B1E;color:#FFFDF9;border:2px solid #7A3B1E;min-height:48px;padding:12px 24px;font-weight:700;letter-spacing:0.02em;}.j2-btn-secondary{display:inline-block;background:transparent;color:#4F5D2F;border:2px solid #4F5D2F;min-height:48px;padding:12px 24px;font-weight:700;letter-spacing:0.02em;}.j2-card{background:#FFFDF9;border:1px solid #E6DAC8;border-radius:12px;padding:16px;box-shadow:0 2px 10px rgba(43,33,24,0.06);}</style>
<!-- J2:style head end -->
<!-- J2:W-1 head start (owner W-1) -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7A3B1E">
<!-- J2:W-1 head end -->
</head>
<body>
<!-- J2:W-1 start (owner W-1) -->
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--j2-background);
    color: var(--j2-text);
    font-family: var(--j2-font-body);
    font-size: 16px;
    line-height: 1.6;
    overflow-x: clip;
  }
  img, svg, video, iframe, table { max-width: 100%; }
  img, svg, video { height: auto; }
  h1, h2, h3, h4 {
    font-family: var(--j2-font-heading);
    color: var(--j2-primary);
    line-height: 1.2;
    margin: 0 0 12px;
    overflow-wrap: anywhere;
  }
  h1 { font-size: clamp(2rem, 7vw, 3.25rem); }
  h2 { font-size: clamp(1.6rem, 5vw, 2.25rem); }
  h3 { font-size: 1.25rem; }
  p { margin: 0 0 12px; overflow-wrap: anywhere; }
  a { color: var(--j2-primary); text-underline-offset: 3px; }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 3px solid var(--j2-accent);
    outline-offset: 2px;
  }
  .j2-container {
    width: 100%;
    max-width: 1120px;
    margin: 0 auto;
    padding-left: 16px;
    padding-right: 16px;
  }
  .j2-section { padding-top: 40px; padding-bottom: 40px; }
  .j2-section-title { text-align: center; margin-bottom: 24px; }
  .j2-grid {
    display: grid;
    gap: 16px;
    grid-template-columns: minmax(0, 1fr);
  }
  .j2-grid > * { min-width: 0; }
  .j2-btn, .j2-btn-secondary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
    font-family: var(--j2-font-body);
    font-size: 1rem;
    max-width: 100%;
  }
  .j2-weave-band {
    height: 10px;
    width: 100%;
    background: repeating-linear-gradient(90deg, #7A3B1E 0 24px, #B5763A 24px 48px, #4F5D2F 48px 72px, #F7F1E8 72px 80px);
  }
  .j2-visually-hidden {
    position: absolute !important;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
  @media (min-width: 640px) {
    .j2-container { padding-left: 24px; padding-right: 24px; }
    .j2-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
  }
  @media (min-width: 1024px) {
    .j2-section { padding-top: 64px; padding-bottom: 64px; }
    .j2-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
  }
</style>
<div class="j2-weave-band" aria-hidden="true"></div>
<!-- J2:W-1 end -->
</body>
</html>
