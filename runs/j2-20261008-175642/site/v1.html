<body>
<!-- J2:W-1 start (owner W-1) -->
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--j2-background, #FAF4EA);
    color: var(--j2-text, #2E2420);
    font-family: var(--j2-font-body, system-ui, sans-serif);
    font-size: 1rem;
    line-height: 1.6;
    overflow-x: hidden;
  }
  img, svg, video { max-width: 100%; height: auto; }
  h1, h2, h3 {
    font-family: var(--j2-font-heading, Georgia, serif);
    color: var(--j2-primary, #7A3E2B);
    line-height: 1.2;
    margin: 0 0 0.5em;
    overflow-wrap: anywhere;
  }
  p { overflow-wrap: anywhere; }
  a { color: var(--j2-primary, #7A3E2B); }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 3px solid var(--j2-accent, #B8862B);
    outline-offset: 2px;
  }

  .w1-header {
    background: var(--j2-surface, #FFFFFF);
    border-bottom: 4px solid var(--j2-accent, #B8862B);
    text-align: center;
    padding: 32px 16px 24px;
  }
  .w1-header__inner { max-width: 1100px; margin: 0 auto; }
  .w1-header__name {
    font-size: clamp(2.25rem, 9vw, 3.75rem);
    font-weight: 700;
    letter-spacing: 0.02em;
    margin: 0;
  }
  .w1-header__rule {
    display: block;
    width: 72px;
    height: 3px;
    margin: 12px auto;
    background: var(--j2-secondary, #55663A);
    border-radius: 3px;
  }
  .w1-header__tag {
    margin: 0;
    color: var(--j2-muted, #6B5A4E);
    font-size: clamp(0.95rem, 3.6vw, 1.125rem);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .w1-header__tag strong { color: var(--j2-secondary, #55663A); font-weight: 700; }
</style>

<header class="w1-header" id="top">
  <div class="w1-header__inner">
    <h1 class="w1-header__name">Thread &amp; Loom</h1>
    <span class="w1-header__rule" aria-hidden="true"></span>
    <p class="w1-header__tag">Handloom clothing boutique &middot; <strong>Pune</strong></p>
  </div>
</header>
