<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J2 Department</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f1f3f2;--panel:#fff;--panel2:#eaeeec;--ink:#18201e;--muted:#5d6865;--line:#d6ddd9;--on:#fff;
  --user:#18201e;--validator:#8a6d1d;--identity:#6b45b3;--adaptation:#3056b8;--priority:#b0680f;
  --coordination:#1f7a55;--builder:#5d6865;--audit:#b4487e;--system:#8a6d1d;--bad:#b83a32;--ok:#2c7d4f;--accent:#0e6b61;
  --wf0:#0f6e8c;--wf1:#8a4f12;--wf2:#5a7a12;--wf3:#9c3d5b;--wf4:#46549c;--wf5:#2f7d6d;
  --display:"Bricolage Grotesque",Arial,sans-serif;--body:"IBM Plex Sans",Arial,sans-serif;--mono:"IBM Plex Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;
  --bg:#101413;--panel:#191f1d;--panel2:#212826;--ink:#e6ebe9;--muted:#9aa5a1;--line:#2d3633;--on:#0f1312;
  --user:#e6ebe9;--validator:#d9b55a;--identity:#ab8cec;--adaptation:#7c9ef0;--priority:#e3a24b;
  --coordination:#5cc596;--builder:#9aa5a1;--audit:#e58ab5;--system:#d9b55a;--bad:#f07a70;--ok:#5fc28c;--accent:#4fc2b2;
  --wf0:#5cc3e0;--wf1:#e0a15c;--wf2:#a9cf5a;--wf3:#e58aa6;--wf4:#94a3f0;--wf5:#6fd1bd}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--body);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
h1{font:700 18px var(--display);margin:0}
.meta{font:500 12px var(--mono);color:var(--muted)}
.spacer{flex:1}
button{font:500 13px var(--body);cursor:pointer}
.ghost{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 11px;border-radius:7px}
.warn{font:500 12px var(--body);color:var(--priority);background:var(--panel2);padding:4px 10px;border-radius:6px}
.steps{display:flex;gap:4px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
.st{flex:1;min-width:120px;padding:6px 8px;border-radius:7px;background:var(--panel2);font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:baseline}
.st b{font:700 13px var(--display);white-space:nowrap}
.st.on{background:var(--accent);color:var(--on)}
.st.past{color:var(--ink)}
main{flex:1;display:grid;grid-template-columns:minmax(320px,1fr) 250px minmax(0,1.3fr);min-height:0}
main>*{min-width:0}
@media (max-width:1100px){main{grid-template-columns:minmax(0,1fr);grid-template-rows:60vh auto 70vh}.lanes{border-right:0;border-bottom:1px solid var(--line);max-height:40vh}}
.chat{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{display:grid;grid-template-columns:30px 1fr;gap:9px}
.av{width:30px;height:30px;border-radius:8px;background:var(--c);color:var(--on);display:grid;place-items:center;font:700 12px var(--display)}
.bubble{background:var(--panel);border:1px solid var(--line);border-radius:4px 12px 12px 12px;padding:8px 11px;min-width:0}
.msg.user .bubble{background:var(--panel2)}
.who{font:600 12.5px var(--body);color:var(--c)}.who span{font:400 11px var(--mono);color:var(--muted);margin-left:6px}
.text{white-space:pre-wrap;word-wrap:break-word}
.tag{display:inline-block;margin:5px 4px 0 0;font:500 11px var(--mono);padding:2px 7px;border-radius:5px;background:var(--panel2);color:var(--muted)}
.tag.bad{color:var(--bad)}.tag.ok{color:var(--ok)}
.sys{font:500 12px var(--mono);color:var(--system);text-align:center;overflow-wrap:anywhere}
.msg.touser .bubble{border:2px solid var(--identity);background:color-mix(in srgb,var(--identity) 9%,var(--panel))}
.touser-label{font:600 11px var(--mono);color:var(--identity);margin-left:6px}
.waiting{border:2px solid var(--identity);border-radius:9px;padding:8px 11px;background:color-mix(in srgb,var(--identity) 9%,var(--panel));font-size:13.5px}
.waiting b{color:var(--identity)}.waiting ol{margin:4px 0 0;padding-left:20px}.waiting .opt{color:var(--muted);font-size:12.5px}
.typing{font-size:13px;color:var(--muted);padding:0 14px 6px;min-height:22px}
.compose{border-top:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--panel)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:5px 10px;border-radius:99px;font-size:12.5px}
.row{display:flex;gap:8px}
textarea{flex:1;resize:none;height:56px;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font:inherit;background:var(--panel);color:var(--ink)}
.send{background:var(--accent);color:var(--on);border:0;border-radius:9px;padding:0 18px;font-weight:600}
.send:disabled,textarea:disabled{opacity:.5;cursor:not-allowed}
.work{display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--line);background:var(--panel);align-items:flex-end;flex-wrap:wrap}
.tabs button{border:0;background:none;color:var(--muted);padding:8px 12px;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent);font-weight:600}
.tabs select{margin:0 0 6px auto;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:4px 6px;font:inherit}
.pane{flex:1;min-height:0;overflow:auto;padding:16px}
.pane.preview{padding:0;background:#fff}
iframe{width:100%;height:100%;border:0;display:block}
.empty{color:var(--muted)}
h3{font:600 15px var(--display);margin:0 0 8px}
table{border-collapse:collapse;width:100%;font-size:13.5px;margin-bottom:14px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{font-weight:600;color:var(--muted);background:var(--panel2)}
.pill{font:600 11px var(--mono);padding:2px 7px;border-radius:5px;background:var(--panel2)}
.pill.done{color:var(--ok)}.pill.failed{color:var(--bad)}.pill.running{color:var(--priority)}
.bar{height:12px;border-radius:6px;background:var(--panel2);overflow:hidden;margin:6px 0 16px;max-width:520px}
.bar i{display:block;height:100%;background:var(--priority)}
dl{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;margin:0 0 14px}
dt{font:500 12px var(--mono);color:var(--muted);padding-top:2px}dd{margin:0}
.pass{color:var(--ok);font-weight:600}.fail{color:var(--bad);font-weight:600}
.lanes{border-right:1px solid var(--line);overflow:auto;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--panel)}
.lanes h2{font:600 13px var(--display);margin:0 0 2px;color:var(--muted)}
.lane{text-align:left;border:1px solid var(--line);border-left:5px solid var(--c);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 8px;font-size:12.5px}
.lane b{color:var(--c);font-size:13px}.lane .d{color:var(--muted);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.lane .pg{font:500 11px var(--mono);color:var(--muted);display:block;margin-top:2px}
.st-working{color:var(--accent)}.st-waiting{color:var(--priority)}.st-blocked{color:var(--bad)}.st-idle{color:var(--muted)}
.pill.st-working,.pill.st-waiting,.pill.st-blocked{font-weight:700}
.tline{display:flex;gap:4px;overflow-x:auto;padding:6px 0 12px;align-items:stretch}
.chip{flex:0 0 auto;border:1px solid var(--line);border-top:4px solid var(--c);background:var(--panel);color:var(--ink);border-radius:6px;padding:4px 7px;font-size:11.5px;text-align:left;max-width:180px}
.chip b{color:var(--c);display:block;font-size:12px}.chip span{color:var(--muted)}
.mark{flex:0 0 auto;align-self:center;font:700 12px var(--display);color:var(--on);background:var(--accent);border-radius:5px;padding:3px 6px}
.msg:not(.user) .bubble{cursor:pointer}.msg:not(.user) .bubble:hover{border-color:var(--c)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);width:min(760px,calc(100vw - 32px));max-height:86vh;padding:0}
dialog::backdrop{background:rgb(0 0 0 / .35)}
.dhead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.dbody{padding:12px 16px;overflow:auto}
.dbody h3{margin-top:14px}
pre{white-space:pre-wrap;word-wrap:break-word;font:12px/1.45 var(--mono);background:var(--panel2);padding:8px 10px;border-radius:7px;max-height:340px;overflow:auto}
#runsel{max-width:min(340px,100%);text-overflow:ellipsis}
.banner{font:500 12.5px var(--body);background:var(--panel2);color:var(--priority);padding:6px 16px;border-bottom:1px solid var(--line)}
.lock{font:500 12px var(--mono);color:var(--coordination)}
</style>
</head>
<body>
<header>
  <h1>J2 Department</h1>
  <span class="meta" id="mode"></span>
  <span class="warn" id="fixes"></span>
  <span class="warn" id="forced" hidden style="color:var(--bad)"></span>
  <span class="warn" id="testles" hidden style="color:var(--bad)">J2_MEMORY_TEST_LESSONS=1: test lessons can be used (demo)</span>
  <span class="warn" id="ph" hidden></span>
  <span class="lock" id="lock"></span>
  <span class="meta" id="mem"></span>
  <span class="spacer"></span>
  <select id="runsel" class="ghost" aria-label="Open a saved run"><option value="">Live run</option></select>
  <button class="ghost" id="reset">New run</button>
</header>
<div class="banner" id="banner" hidden></div>
<div class="steps" id="steps"></div>
<main>
  <section class="chat">
    <div class="msgs" id="msgs"></div>
    <div class="typing" id="typing"></div>
    <div class="compose">
      <div class="waiting" id="waiting" hidden></div>
      <div class="quick" id="quick"></div>
      <div class="row">
        <textarea id="box" placeholder="Describe the website you want. The agents take it from there…" aria-label="Message"></textarea>
        <button class="send" id="send">Send</button>
      </div>
    </div>
  </section>
  <aside class="lanes" id="lanes" aria-label="Agents"></aside>
  <section class="work">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="preview" aria-selected="true">Preview</button>
      <button role="tab" data-tab="goal" aria-selected="false">Goal</button>
      <button role="tab" data-tab="workflows" aria-selected="false">Workflows</button>
      <button role="tab" data-tab="conflicts" aria-selected="false">Conflicts</button>
      <button role="tab" data-tab="timeline" aria-selected="false">Timeline</button>
      <button role="tab" data-tab="audit" aria-selected="false">Audit</button>
      <button role="tab" data-tab="lessons" aria-selected="false">Lessons</button>
      <button role="tab" data-tab="report" aria-selected="false">Report</button>
      <select id="ver" aria-label="Version"></select>
    </div>
    <div class="pane preview" id="pane-preview"><iframe id="frame" title="Website preview" src="/site/latest"></iframe></div>
    <div class="pane" id="pane-goal" hidden></div>
    <div class="pane" id="pane-workflows" hidden></div>
    <div class="pane" id="pane-conflicts" hidden></div>
    <div class="pane" id="pane-timeline" hidden></div>
    <div class="pane" id="pane-audit" hidden></div>
    <div class="pane" id="pane-lessons" hidden></div>
    <div class="pane" id="pane-report" hidden></div>
  </section>
</main>
<dialog id="detail"><div class="dhead"><b id="dtitle"></b><span class="spacer"></span><button class="ghost" id="dclose">Close</button></div>
  <div class="dbody" id="dbody"></div></dialog>
<script>
const WHO = {user:["Requester (you)","R"],validator:["Validator","V"],identity:["Identity","I"],adaptation:["Adaptation","Ad"],
  priority:["Priority","P"],coordination:["Coordination","C"],builder:["Builder","B"],audit:["Audit","Au"],system:["System","!"]};
// Workflow agents ("W-1") get "W-1 Builder" and a colour from the --wf palette.
const isWf = k => /^W-\d+$/.test(k || "");
const who = k => WHO[k] || (isWf(k) ? [k + " Builder", k.replace("-", "")] : [k, "?"]);
const col = k => isWf(k) ? `var(--wf${(+k.slice(2) - 1) % 6})` : `var(--${k})`;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/@(\w+)/g,"<b>@$1</b>");
let seen = 0, state = null, versions = 0, allChat = [], viewRun = new URLSearchParams(location.search).get("run") || "";
const runQ = () => viewRun ? "&run=" + encodeURIComponent(viewRun) : "";

function addMsg(m){
  const el = document.createElement("div");
  if (m.who === "system"){ el.className = "sys"; if (m.test) el.style.cssText = "color:var(--bad);font-weight:700";
    el.textContent = m.text; $("msgs").appendChild(el); return; }
  el.className = "msg " + m.who + (m.to_user ? " touser" : ""); el.style.setProperty("--c", col(m.who)); el.dataset.id = m.id;
  let t = "";
  if (m.act) t += `<span class="tag ${m.act==="PARK"||m.act==="DISPUTE"?"bad":m.act==="LESSON"?"ok":""}">${m.act}</span>`;
  if (m.auto) t += `<span class="tag">by code, no AI call</span>`;
  if (m.envelope) t += `<span class="tag ${m.envelope==="allowed"?"ok":"bad"}">envelope: ${m.envelope}</span>`;
  if (m.attempt) t += `<span class="tag ${m.agree?"ok":"bad"}">${m.agree?"agrees":"holds position"} · attempt ${m.attempt}/4</span>`;
  if (m.next && !m.to_user) t += `<span class="tag">→ ${esc(who(m.next)[0])}</span>`;
  if (m.lesson_used) t += m.lesson_test ? `<span class="tag bad">used TEST LESSON ${esc(m.lesson_used)} (from a forced failure, demo only)</span>`
    : `<span class="tag ok">used lesson ${esc(m.lesson_used)}</span>`;
  if (m.lessons) t += `<span class="tag ok">saved ${esc(m.lessons.join(", "))}</span>`;
  if (m.section) t += `<span class="tag">section ${esc(m.section)}</span>`;
  if (m.workable !== undefined) t += `<span class="tag ${m.workable?"ok":"bad"}">${m.workable?"workable":"not workable"}</span>`;
  if (m.stamp === true) t += `<span class="tag ok">charter valid</span>`;
  if (m.stamp === false) t += `<span class="tag bad">charter rejected</span>`;
  if (m.proposal) t += `<span class="tag">proposes ${m.proposal.length} workflow(s) · ${m.proposal.reduce((a,w)=>a+(+w.cost||0),0)} units</span>`;
  if (m.decision && m.who === "priority") t += `<span class="tag ${m.decision==="grant"?"ok":"bad"}">${m.decision.toUpperCase()} · ${m.exchange==="ruling"?"after ruling":"exchange "+m.exchange+"/4"}</span>`;
  if (m.accept !== undefined) t += `<span class="tag ${m.accept?"ok":"bad"}">${m.accept?"accepts":"pushes back"} · exchange ${m.exchange}/4</span>`;
  if (m.conflict) t += `<span class="tag bad">${m.conflict}${m.decision === true ? " · ruling" : ""}</span>`;
  if (m.forced_test) t += `<span class="tag bad">TEST: item ${m.forced_test} forced to fail, not a real finding</span>`;
  if (m.check) t += `<span class="tag ${m.ok?"ok":"bad"}">charter check: ${m.ok?"ok":"issues"}</span>`;
  if (m.schedule) t += `<span class="tag">schedule: ${m.schedule.join(" → ")}</span>`;
  if (m.done !== undefined) t += `<span class="tag ${m.done?"ok":"bad"}">${m.done?"done-when holds":"not done"}</span>`;
  if (m.register === true) t += `<span class="tag ok">registered</span>`;
  if (m.register === false) t += `<span class="tag bad">rejected</span>`;
  if (m.version) t += `<span class="tag">site v${m.version}</span>`;
  if (m.audit !== undefined) t += `<span class="tag ${m.audit?"ok":"bad"}">${m.audit?"all criteria pass":"criteria failing"}</span>`;
  el.innerHTML = `<div class="av">${esc(who(m.who)[1])}</div><div class="bubble"><div class="who">${esc(who(m.who)[0])}${m.to_user ? '<span class="touser-label">to you</span>' : ""}<span>${m.t}</span></div>
    <div class="text">${md(m.text)}</div>${t ? `<div>${t}</div>` : ""}</div>`;
  $("msgs").appendChild(el);
}
function renderSteps(s){
  $("steps").innerHTML = Object.entries(s.steps).map(([n,l]) =>
    `<div class="st ${+n===s.step?"on":(+n<s.step?"past":"")}"><b>${esc(l.split(" ")[0])}</b>${esc(l.split(" ").slice(1).join(" "))}</div>`).join("");
}
function renderGoal(s){
  const g = s.goal;
  if (!g) return `<p class="empty">Identity reads your brief (J2.a), asks you for anything it needs, records the charter, and the validator checks it before work starts.</p>`;
  return `<h3>${esc(g.site_name || "Goal")} ${s.stamped ? '<span class="pill done">validated</span>' : ""}</h3>
    <dl><dt>goal</dt><dd>${esc(g.statement)}</dd><dt>audience</dt><dd>${esc(g.audience)}</dd>
    <dt>standards</dt><dd>${(g.standards||[]).map(esc).join("<br>")}</dd><dt>rules</dt><dd>${(g.rules||[]).map(esc).join("<br>")}</dd>
    <dt>done when</dt><dd>${(g.done_when||[]).map(esc).join("<br>")}</dd>
    ${(g.to_be_confirmed||[]).length ? `<dt>to be confirmed</dt><dd class="fail">${g.to_be_confirmed.map(t => esc(t.criterion + ": " + t.fact)).join("<br>")}<br><span class="empty">These items are not met until you confirm the fact.</span></dd>` : ""}
    ${(g.confirmed_facts||[]).length ? `<dt>confirmed by you</dt><dd>${g.confirmed_facts.map(t => esc(t.criterion + ": " + t.fact)).join("<br>")}</dd>` : ""}
    ${(g.dropped_by_requester||[]).length ? `<dt>dropped by you</dt><dd>${g.dropped_by_requester.map(esc).join("<br>")}</dd>` : ""}</dl>`;
}
function envCell(w){
  const e = w.envelope; if (!e) return '<span class="empty">none</span>';
  return `money ${e.money_limit} · calls ${w.calls_used||0}/${e.model_call_limit} · retries ${w.retries_used||0}/${e.retry_limit}`
    + (e.time_limit_minutes != null ? ` · ${e.time_limit_minutes} min` : "")
    + (e.stop_loss ? `<br><span class="empty">stop-loss: ${esc(e.stop_loss)}</span>` : "");
}
function renderWorkflows(s){
  const pct = Math.min(100, s.spent / s.budget * 100);
  const rows = s.workflows.map(w => `<tr><td>${w.id}</td><td style="color:${col(w.id)}"><b>${esc(w.agent || who(w.id)[0])}</b><br><span class="empty">section ${esc(w.section || "")}${w.revises ? " (rewrites " + esc(w.revises) + "'s)" : ""}</span></td><td>${esc(w.name)}<br><span class="empty">${esc(w.purpose)}</span></td>
    <td>${w.cost}${w.charged === false ? '<br><span class="empty">released</span>' : ""}</td>
    <td>${envCell(w)}</td><td>${w.cycle}</td><td><span class="pill ${w.status}">${w.status}</span></td></tr>`).join("");
  return `<h3>Budget: ${s.spent} of ${s.budget} units used</h3><div class="bar"><i style="width:${pct}%"></i></div>
    ${rows ? `<table><tr><th>ID</th><th>Agent</th><th>Workflow</th><th>Charged</th><th>Envelope</th><th>Cycle</th><th>Status</th></tr>${rows}</table>`
      : `<p class="empty">Nothing registered yet. Adaptation proposes, Priority answers, the validator registers what's agreed.</p>`}`;
}
function renderConflicts(s){
  if (!s.conflicts.length) return `<p class="empty">No conflicts yet. Any two agents that disagree get 4 attempts to settle it; then Identity resolves it from the charter, or asks you. Every disagreement is logged here and in conflicts.json.</p>`;
  const pos = p => Array.isArray(p) ? (p.map(w => `${esc(w.name)} (${w.cost ?? "?"})`).join("<br>") || "nothing") : esc(p);
  const by = {agents:"the agents themselves", identity:"Identity, from the charter", identity_after_user:"Identity, after your answer", default:"default (no ruling)"};
  return s.conflicts.slice().reverse().map(c => {
    const [a, b] = c.between, n = c.attempts.filter(x => x.n > 0).length;
    const tries = c.attempts.map(x => `<tr><td>${x.n || "open"}</td><td>${esc(who(x.who)[0])}${x.msg ? ` <span class="empty">[${x.msg}]</span>` : ""}</td>
      <td>${esc(x.text)}</td><td class="${x.agree ? "pass" : ""}">${x.agree ? "agrees" : esc(x.position || "")}</td></tr>`).join("");
    const idr = (c.identity || []).map(r => `${r.after_user ? "After your answer" : "From the charter"}: ${r.resolved ? "ruled <b>" + esc(r.ruling) + "</b>" : "<b>couldn't resolve</b>"}. ${esc(r.clause ? "Clause: " + r.clause + ". " : "")}${esc(r.say)}`).join("<br>");
    const finals = c.topic === "proposal" ? `<tr><th>${esc(who(a)[0])}'s final position</th><th>${esc(who(b)[0])}'s final position</th></tr>
      <tr><td>${pos(c.adaptation_final)}</td><td>${pos(c.priority_final)}</td></tr>` : "";
    return `<h3>${c.id} · cycle ${c.cycle} · ${esc(who(a)[0])} vs ${esc(who(b)[0])} · ${esc(c.subject)} <span class="pill ${c.status === "settled" ? "done" : "running"}">${c.status}</span></h3>
    <dl><dt>attempts</dt><dd>${n} of 4${c.escalated ? ` · escalated to Identity after ${c.attempts_before_escalation}` : " · settled without escalating"}</dd>
    <dt>resolved by</dt><dd>${esc(by[c.resolved_by] || "open")}</dd>
    ${idr ? `<dt>Identity</dt><dd>${idr}</dd>` : ""}
    ${c.user_question ? `<dt>asked you</dt><dd>${esc(c.user_question.question)}${(c.user_question.options||[]).map((o,i) => `<br><span class="empty">Option ${i+1}: ${esc(o)}</span>`).join("")}</dd>
      <dt>your answer</dt><dd>${c.user_answer ? esc(c.user_answer) : '<span class="fail">waiting</span>'}</dd>` : ""}
    <dt>outcome</dt><dd>${esc(c.outcome || "open")}${c.registered ? ` · registered: ${esc(c.registered.join(", ") || "nothing")}` : ""}</dd></dl>
    ${finals ? `<table>${finals}</table>` : ""}
    <table><tr><th>#</th><th>Who</th><th>Message</th><th>Position</th></tr>${tries}</table>`; }).join("");
}
function renderAudit(s){
  if (!s.audits.length) return `<p class="empty">Audit checks the site against Identity's "done when" list after each cycle.</p>`;
  const wk = s.workable ? (s.workable.length ? `<h3 class="fail">Not workable yet (checked by code)</h3><ul>${s.workable.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`
    : `<h3 class="pass">Workable (checked by code)</h3>`) : "";
  return wk + s.audits.slice().reverse().map(a => `<h3>Cycle ${a.cycle} · site v${a.version} · ${a.all_pass ? '<span class="pass">all pass</span>' : '<span class="fail">failing</span>'}</h3>
    <table><tr><th>Criterion</th><th>Result</th><th>Evidence</th></tr>${a.results.concat(a.extra_issues||[]).map(r => `<tr><td>${r.id ? `<b>${esc(r.id)}</b> ` : ""}${r.item ? r.item + ". " : "extra: "}${esc(r.criterion)}</td>
    <td class="${r.pass?"pass":"fail"}">${esc(r.verdict || (r.pass?"PASS":"FAIL"))}</td><td>${esc(r.note)}</td></tr>`).join("")}</table>`).join("");
}
const ROLE = {identity:"J2.a charter, J2.d rulings, J2.h workable?", adaptation:"J2.b proposes, disputes, saves lessons",
  priority:"J2.c prices, checks run envelopes", coordination:"J2.f schedules, holds the write lock", audit:"J2.g checks the site",
  validator:"J2.e code: checks and registers workflows"};
const stepTag = (s, n) => s.steps[n] ? s.steps[n].split(" ")[0] : "";
function renderLanes(s){
  return `<h2>Agents · live status</h2>` + s.lanes.map(l => { const p = l.progress;
    return `<button type="button" class="lane" data-msg="${l.last_msg ?? ""}" style="--c:${col(l.id)}">
      <b>${esc(l.name)}</b> <span class="pill st-${l.status}">${l.status}${l.on ? " on " + esc(l.on) : ""}</span>
      ${l.test_lesson ? `<span class="pill" style="color:var(--bad)">test lesson ${esc(l.test_lesson)}</span>` : ""}
      <span class="d">${esc(l.doing || ROLE[l.id] || "")}</span>
      ${p ? `<span class="pg">section ${esc(p.section)} · attempts ${p.attempts}/${p.attempt_limit} · retries ${p.retries}/${p.retry_limit}${p.write_lock ? " · write lock" : ""}<br>last check: ${esc(p.last_check || "not run yet")}</span>` : ""}
    </button>`; }).join("");
}
function decided(m){
  if (m.decision && m.who === "priority") return String(m.decision).toUpperCase();
  if (m.act) return m.act;
  if (m.envelope) return "envelope " + m.envelope;
  if (m.register !== undefined) return m.register ? "registered" : "rejected";
  if (m.stamp !== undefined) return m.stamp ? "charter valid" : "charter rejected";
  if (m.audit !== undefined) return m.workable ? "workable" : m.audit ? "all pass" : "findings";
  if (m.done !== undefined) return m.done ? "done" : "not done";
  if (m.accept !== undefined) return m.accept ? "accepts" : "pushes back";
  if (m.attempt) return m.agree ? "agrees" : "holds";
  if (m.to_user) return "asks you";
  if (m.version) return "site v" + m.version;
  return "";
}
function renderTimeline(s){
  let prev = null, out = "";
  s.allChat.filter(m => m.who !== "system").forEach(m => {
    if (m.step && m.step !== prev){ out += `<span class="mark" title="${esc(s.steps[m.step] || "")}">${esc(stepTag(s, m.step))}</span>`; prev = m.step; }
    out += `<button type="button" class="chip" data-msg="${m.id}" style="--c:${col(m.who)}" title="${esc(m.text.slice(0, 200))}">
      <b>${esc(who(m.who)[0])}</b>${esc(decided(m) || m.text.slice(0, 40))}<br><span>[${m.id}] ${m.t}</span></button>`;
  });
  return `<h3>Every step in order <span class="empty">(coloured by agent; J2 step marked; click for details)</span></h3>
    <div class="tline">${out || '<span class="empty">Nothing yet.</span>'}</div>
    <p class="empty">${s.calls} AI calls · ${s.allChat.length} messages · cycle ${s.cycle}</p>`;
}
async function openDetail(id){
  const m = state && state.allChat.find(x => x.id === +id); if (!m || m.who === "system" || m.who === "user") return;
  const calls = (m.calls || []).map(c => state.call_log.find(x => x.id === c)).filter(Boolean);
  const sum = (k) => calls.reduce((a, c) => a + (c[k] || 0), 0);
  const tokIn = calls.some(c => c.tokens) ? calls.reduce((a, c) => a + ((c.tokens || {}).input || 0), 0) : null;
  const tokOut = calls.some(c => c.tokens) ? calls.reduce((a, c) => a + ((c.tokens || {}).output || 0), 0) : null;
  const charged = m.charged ?? 0, last = calls[calls.length - 1];
  const reply = last && last.reply ? Object.fromEntries(Object.entries(last.reply).filter(([k]) => k !== "say")) : null;
  $("dtitle").innerHTML = `<span style="color:${col(m.who)}">${esc(who(m.who)[0])}</span> · message ${m.id} · ${esc(state.steps[m.step] || "")}`;
  $("dbody").innerHTML = `<p>${md(m.text)}</p>`
    + (calls.length ? `<h3>What it read</h3><dl>${last.inputs.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
      <details id="full"><summary>Full text of what it was given (${calls.length > 1 ? "last of " + calls.length + " calls, " : ""}${last.chars.prompt.toLocaleString()} characters)</summary><pre id="fulltext">Loading…</pre></details>
      <h3>What it decided</h3><p><b>${esc(decided(m) || "see reply")}</b></p>${reply ? `<pre>${esc(JSON.stringify(reply, null, 2))}</pre>` : ""}
      <h3>Why</h3><p>${esc(last.reason || "No reason given in the reply.")}</p>`
      : `<h3>What it read / decided / why</h3><p class="empty">Written by code, no AI call (${esc(decided(m) || "a rule in j2.py")}).</p>`)
    + `<h3>Cost of this step</h3><dl><dt>AI calls</dt><dd>${calls.length}</dd>
      <dt>tokens</dt><dd>${tokIn === null ? `not reported${state.mock ? " (mock mode)" : " by this provider"}; ${calls.reduce((a, c) => a + c.chars.prompt + c.chars.reply, 0).toLocaleString()} characters in and out` : `${tokIn.toLocaleString()} in · ${tokOut.toLocaleString()} out`}</dd>
      <dt>time</dt><dd>${calls.length ? sum("seconds").toFixed(1) + " s" : "instant (code)"}</dd>
      <dt>budget units charged</dt><dd>${charged}${m.workflow_cost ? ` · this workflow costs ${m.workflow_cost} (charged at registration)` : ""}</dd></dl>`;
  if (!$("detail").open) $("detail").showModal();
  const f = $("full");
  if (f) f.addEventListener("toggle", async () => { if (!f.open || $("fulltext").dataset.ok) return;
    const r = await fetch(`/api/call?id=${last.id}${viewRun ? "&run=" + encodeURIComponent(viewRun) : ""}`);
    const c = r.ok ? await r.json() : null;
    $("fulltext").textContent = c ? `SYSTEM PROMPT\n${c.system}\n\nPROMPT\n${c.prompt}\n\nRAW REPLY\n${c.raw}` : "Not found.";
    $("fulltext").dataset.ok = 1; });
}
function renderLessons(s){
  if (!s.memory) return `<p class="empty">Memory is off (J2_MEMORY=0): no lessons are read or saved in this run.</p>`;
  const used = new Set(s.lessons_used.map(x => x.lesson)), saved = new Set(s.lessons_saved);
  const rows = s.lessons.slice().reverse().map(l => `<tr><td><b>${esc(l.id)}</b>${saved.has(l.id) ? ' <span class="pill done">new this run</span>' : ""}${used.has(l.id) ? ' <span class="pill running">used this run</span>' : ""}${l.test ? ' <span class="pill" style="color:var(--bad)">test lesson</span>' : ""}<br><span class="empty">${esc(l.t || "")}</span></td>
    <td>${esc(l.problem)}</td><td>${esc(l.cause)}</td><td>${esc(l.fix)}</td><td>${esc(l.run)}</td></tr>`).join("");
  return `<h3>Lessons (${s.lessons.length}) <button type="button" class="ghost" id="clear-lessons">Clear memory</button></h3>
    <p class="empty">Adaptation saves a lesson when Audit confirms a fix worked, and reads the 5 most relevant at J2.b. Stored in memory/lessons.jsonl.</p>
    ${rows ? `<table><tr><th>Lesson</th><th>Problem</th><th>Cause</th><th>Fix</th><th>Run</th></tr>${rows}</table>` : '<p class="empty">No lessons yet.</p>'}`;
}
function renderReport(s){
  const R = s.report;
  if (!R) return `<p class="empty">The run report appears here when a run ends or pauses: counts measured by code, and learnings from a reviewer call.</p>`;
  const m = R.metrics, r = R.review || {}, n = m.negotiation;
  const list = (t, xs) => (xs && xs.length) ? `<h3>${t}</h3><ul>${xs.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "";
  const agents = Object.entries(m.agents).map(([k,a]) => { const sc = (r.agents||{})[k] || {};
    return `<tr><td style="color:${col(k)}">${esc(who(k)[0])}</td><td>${a.turns}</td><td class="${a.redirects?"fail":""}">${a.redirects}</td>
      <td class="${a.invalid_moves?"fail":""}">${a.invalid_moves}</td><td>${sc.score ?? ""}</td><td>${esc(sc.note || "")}</td></tr>`; }).join("");
  const cf = m.conflicts;
  const conf = cf.list.length ? cf.list.map(c => `<li>${c.id} · cycle ${c.cycle} · ${c.between.map(x => who(x)[0]).join(" vs ")}: ${c.attempts} attempt(s)${c.escalated ? ", escalated" : ""}, resolved by ${esc(c.resolved_by || "open")}${c.user_question ? `; asked you “${esc(c.user_question)}”, answer “${esc(c.user_answer || "waiting")}”` : ""}. ${esc(c.outcome || "")}</li>`).join("")
      : "<li>None</li>";
  const est = m.workflows.estimate_vs_charged.map(w => `<tr><td>${w.id}</td><td>${esc(w.name)}</td><td>${w.agent_estimate ?? ""}</td><td>${w.charged}</td></tr>`).join("");
  return `<h3>${esc(m.outcome || "")}</h3><p><b>Reviewer:</b> ${esc(r.verdict || "")}</p>
    <h3>Measured by code</h3>
    <dl><dt>run</dt><dd>${m.ai_calls} AI calls · ${m.cycles} cycles · ${m.minutes} min · ${esc(m.model || "mock")}</dd>
    <dt>budget</dt><dd>${m.budget.spent} of ${m.budget.total} · started ${m.budget.start ?? m.budget.total}${(m.budget.raises||[]).length ? ` · raised on your approval ${m.budget.raises.map(r => r.from+"→"+r.to).join(", ")} (cap ${m.budget.cap})` : ""} · rate card ${m.budget.rate_card ? "on" : "off"}</dd>
    <dt>site</dt><dd>${m.site_versions} versions · ${(m.site_bytes/1000).toFixed(0)} KB</dd>
    <dt>negotiation</dt><dd>${n.proposals} proposals · ${n.grants} GRANT / ${n.counters} COUNTER / ${n.refuses} REFUSE${n.refuses_converted_by_code ? ` (${n.refuses_converted_by_code} by code)` : ""} · ${n.parks} parked</dd>
    <dt>conflicts</dt><dd>${cf.total} · ${cf.settled_by_agents} settled by the agents · ${cf.resolved_by_identity} by Identity from the charter · ${cf.asked_requester} needed you</dd>
    <dt>questions to you</dt><dd>${m.requester_questions.total}${Object.entries(m.requester_questions.by_kind).map(([k,v]) => ` · ${esc(k)} ${v}`).join("")}</dd>
    <dt>guards</dt><dd>${m.validator_refusals} validator refusals (${m.role_refusals} role) · ${m.limit_failures} limit failures · ${m.warnings} warnings</dd></dl>
    <h3>Agents</h3><table><tr><th>Agent</th><th>Turns</th><th>Redirects</th><th>Invalid moves</th><th>Score (reviewer)</th><th>Note (reviewer)</th></tr>${agents}</table>
    <h3>Conflicts</h3><ul>${conf}</ul>
    <h3>Audit by cycle</h3><table><tr><th>Cycle</th><th>Version</th><th>Pass</th><th>Warn</th><th>Fail</th><th>Mechanical check</th></tr>
      ${m.audits.map(a => `<tr><td>${a.cycle}</td><td>v${a.version}</td><td>${a.pass}</td><td>${a.warn}</td><td class="${a.fail?"fail":""}">${a.fail}</td>
      <td class="${(a.mechanical||[]).length?"fail":""}">${!a.mechanical_ran ? "not run" : (a.mechanical||[]).length ? esc(a.mechanical.join("; ")) : "clean"}</td></tr>`).join("")}</table>
    ${est ? `<h3>Agent estimate vs charged</h3><table><tr><th>ID</th><th>Workflow</th><th>Agent estimate</th><th>Charged</th></tr>${est}</table>` : ""}
    ${list("What went well (reviewer)", r.went_well)}${list("Problems (reviewer)", r.problems)}${list("Learnings (reviewer)", r.learnings)}
    <details><summary>Event log (${R.events.length})</summary><ul>${R.events.map(e => `<li>[${e.msg}] ${esc(e.agent)} · ${esc(e.type)}: ${esc(e.detail)}</li>`).join("")}</ul></details>
    <p class="empty">Saved as report.json and report.md in the run folder. Scores and learnings are one reviewer model's judgment; counts are exact.</p>`;
}
function quick(s){
  let items = [];
  if (!s.total) items = ["A website for my cafe", "A website for Sweet Crumbs Bakery in Pune: menu, cake orders, contact", "A portfolio site for a wedding photographer"];
  else if (s.status === "waiting" && s.done && !s.paused) items = ["Add a section for visiting hours", "Looks good"];
  $("quick").innerHTML = items.map(t => `<button type="button">${esc(t)}</button>`).join("");
  [...$("quick").children].forEach(b => b.onclick = () => { $("box").value = b.textContent; send(); });
}
async function poll(){
  try{
    const s = await (await fetch(`/api/state?since=${seen}${runQ()}`, {cache:"no-store"})).json();
    s.chat.forEach(addMsg);
    allChat = allChat.concat(s.chat); s.allChat = allChat;
    if (s.chat.length){ seen = s.total; $("msgs").scrollTop = $("msgs").scrollHeight; }
    renderSteps(s);
    $("typing").innerHTML = s.thinking ? `<b style="color:${col(s.thinking)}">${esc(who(s.thinking)[0])}</b> is working…`
      : s.status === "running" ? "Working…" : s.status === "waiting" ? "Your turn." : "";
    const busy = s.status === "running" || !!s.saved, p = s.paused;
    $("banner").hidden = !s.saved;
    if (s.saved) $("banner").textContent = `Viewing saved run ${s.saved} (read only). ${s.outcome || ""}`;
    $("lanes").innerHTML = renderLanes(s);
    $("waiting").hidden = !p || busy;
    if (p) $("waiting").innerHTML = `<b>Identity is waiting on your answer</b> · ${esc(p.label)} <span class="empty">(message ${p.msg})</span>`
      + (p.questions.length ? `<ol>${p.questions.map(q => `<li>${esc(q.question)}${q.options.map((o,i) => `<div class="opt">Option ${i+1}: ${esc(o)}</div>`).join("")}</li>`).join("")}</ol>` : "");
    $("box").placeholder = p ? "Answer Identity's question…" : s.total ? "Ask for a change…" : "Describe the website you want. The agents take it from there…";
    $("box").disabled = busy; $("send").disabled = busy;
    $("mode").textContent = (s.mock ? "mock functions" : `model: ${s.model}`) + ` · ${s.calls} AI calls · cycle ${s.cycle}`;
    $("fixes").textContent = s.fixes ? "J2_FIXES=1 (fixes)" : "J2_FIXES=0 (baseline, as in the diagram)";
    $("forced").hidden = !s.force_audit_fail;
    $("testles").hidden = !s.test_lessons;
    $("forced").textContent = `TEST: J2_FORCE_AUDIT_FAIL=${s.force_audit_fail} (cycle 1 Audit result forced)`;
    $("lock").textContent = s.write_lock ? `write lock: ${who(s.write_lock)[0]}` : "";
    $("mem").textContent = s.memory ? `memory on · ${s.lessons.length} lesson(s)` : "memory off";
    $("ph").hidden = !s.placeholders.length;
    $("ph").textContent = `Placeholder md: ${s.placeholders.join(", ")}`;
    if (s.versions !== versions){
      versions = s.versions;
      $("ver").innerHTML = Array.from({length:versions}, (_,i) => `<option value="v${i+1}">v${i+1}</option>`).join("") || "<option>no site yet</option>";
      $("ver").value = versions ? "v"+versions : ""; $("frame").src = `/site/${versions ? "v"+versions : "latest"}?t=${Date.now()}${runQ()}`;
    }
    $("pane-goal").innerHTML = renderGoal(s); $("pane-workflows").innerHTML = renderWorkflows(s);
    $("pane-conflicts").innerHTML = renderConflicts(s); $("pane-audit").innerHTML = renderAudit(s);
    $("pane-report").innerHTML = renderReport(s);
    $("pane-timeline").innerHTML = renderTimeline(s); $("pane-lessons").innerHTML = renderLessons(s);
    if (!state || state.status !== s.status || state.total !== s.total) quick(s);
    state = s;
  }catch(e){}
  if (!(state && state.saved)) setTimeout(poll, 700);   // a saved run doesn't change: load it once
}
$("ver").onchange = () => $("frame").src = `/site/${$("ver").value}?t=${Date.now()}${runQ()}`;
document.querySelectorAll(".tabs [role=tab]").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs [role=tab]").forEach(x => x.setAttribute("aria-selected", x === b));
  ["preview","goal","workflows","conflicts","timeline","audit","lessons","report"].forEach(t => $("pane-"+t).hidden = t !== b.dataset.tab);
});
async function send(){
  const text = $("box").value.trim(); if (!text) return;
  $("box").value = "";
  await fetch("/api/say", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({text})});
}
$("send").onclick = send;
// Delegated clicks: panes are re-rendered on every poll.
// Detail view: click an agent message, a timeline step, or a lane (its latest message).
$("msgs").addEventListener("click", e => { const b = e.target.closest(".msg"); if (b && b.dataset.id) openDetail(b.dataset.id); });
$("pane-timeline").addEventListener("click", e => { const b = e.target.closest("[data-msg]"); if (b) openDetail(b.dataset.msg); });
$("lanes").addEventListener("click", e => { const b = e.target.closest("[data-msg]"); if (b && b.dataset.msg) openDetail(b.dataset.msg); });
$("dclose").onclick = () => $("detail").close();
// Saved runs: pick one to open it read-only; the URL keeps ?run= so it can be reloaded or shared locally.
(async () => { try { const r = await (await fetch("/api/runs")).json();
  $("runsel").innerHTML = `<option value="">Live run (${esc(r.live)})</option>` + r.runs.filter(x => x.id !== r.live)
    .map(x => `<option value="${esc(x.id)}">${esc(x.id)} · ${esc(x.status)} · ${esc(x.brief.slice(0, 50))}</option>`).join("");
  $("runsel").value = viewRun; } catch (e) {} })();
$("runsel").onchange = () => { location.search = $("runsel").value ? "?run=" + encodeURIComponent($("runsel").value) : ""; };
$("pane-lessons").addEventListener("click", async e => {
  if (e.target.id !== "clear-lessons" || !confirm("Delete every saved lesson (memory/lessons.jsonl)? This can't be undone.")) return;
  await fetch("/api/lessons/clear", {method:"POST"});
});
$("box").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }});
$("reset").onclick = async () => { await fetch("/api/reset", {method:"POST"}); location.search = ""; };
poll();
</script>
